<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QX700 ddPCR WebApps &amp; Calculators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #eef2f0;
    --panel: #ffffff;
    --ink: #10201d;
    --ink-soft: #4b5f5a;
    --line: #d6e0dc;
    --teal: #0e7c76;
    --teal-deep: #085a56;
    --teal-wash: #e3f2f0;
    --amber: #c98a1e;
    --amber-wash: #fbf1de;
    --red: #c0392b;
    --red-wash: #fbe9e7;
    --blue: #2e6da4;
    --blue-wash: #e6eef5;
    --grey-wash: #eef0ef;
    --radius: 10px;
    --da-pink: #d1428f;
    --da-neg: #98a29c;
    --da-rain: #c98a1e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    padding:28px 20px 60px;
  }
  .wrap{max-width:980px;margin:0 auto;}

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .brand-mark{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .droplet-logo{width:34px;height:34px;flex-shrink:0;}
  h1{
    font-family:'IBM Plex Sans Condensed', sans-serif;
    font-weight:600;
    font-size:22px;
    letter-spacing:0.2px;
    margin:0;
    color:var(--ink);
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--teal-deep);
    margin:0 0 2px;
  }
  .source-note{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    text-align:right;
  }
  .version-badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    font-weight:500;
    color:var(--ink-soft);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px 11px;
    flex-shrink:0;
    white-space:nowrap;
  }

  /* ---------- tabs ---------- */
  .tabs{
    display:flex;
    gap:6px;
    border-bottom:2px solid var(--line);
    margin-bottom:20px;
    overflow-x:auto;
  }
  .tab-btn{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:13.5px;
    color:var(--ink-soft);
    background:none;
    border:none;
    padding:10px 16px 12px;
    cursor:pointer;
    white-space:nowrap;
    border-bottom:2px solid transparent;
    margin-bottom:-2px;
    transition:color .15s;
  }
  .tab-btn:hover{color:var(--teal-deep);}
  .tab-btn.active{
    color:var(--teal-deep);
    border-bottom-color:var(--teal);
  }

  /* ---------- nav (back button / sheet dropdown) ---------- */
  .tabs.nav-bar{
    border-bottom:none;
    align-items:center;
    gap:10px 14px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .back-btn{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:13px;
    color:var(--teal-deep);
    background:var(--teal-wash);
    border:1px solid #bfe2dd;
    border-radius:7px;
    padding:8px 14px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s;
  }
  .back-btn:hover{background:#d3e9e6;}
  .sheet-select{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:13.5px;
    color:var(--ink);
    background:#fafcfb;
    border:1px solid var(--line);
    border-radius:7px;
    padding:8px 12px;
    cursor:pointer;
    flex:1;
    max-width:420px;
  }
  .nav-current-label{
    font-family:'IBM Plex Sans Condensed', sans-serif;
    font-weight:600;
    font-size:14px;
    color:var(--ink);
  }
  .promo-banner{
    background:var(--teal-wash);
    border:1px solid #bfe2dd;
    border-radius:var(--radius);
    padding:12px 16px;
    margin-bottom:18px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .promo-line{
    font-size:12.5px;
    color:var(--teal-deep);
    line-height:1.5;
  }
  .promo-line a{
    color:var(--teal-deep);
    font-weight:600;
    text-decoration:none;
    border-bottom:1px solid #9cd3cc;
  }
  .promo-line a:hover{border-bottom-color:var(--teal-deep);}
  .product-link{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:12.5px;
    color:var(--teal-deep);
    text-decoration:none;
    white-space:normal;
    border-bottom:1px solid transparent;
    transition:border-color .15s;
  }
  .product-link:hover{border-bottom-color:var(--teal-deep);}
  .product-link svg{flex-shrink:0;}

  /* ---------- home page ---------- */
  .home-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:18px;
    max-width:1080px;
    margin:20px auto 0;
  }
  @media (max-width:860px){
    .home-grid{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:560px){
    .home-grid{grid-template-columns:1fr;}
  }
  .home-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:32px 26px;
    text-align:left;
    cursor:pointer;
    font-family:inherit;
    transition:border-color .15s, box-shadow .15s, transform .15s;
  }
  .home-card:hover{
    border-color:var(--teal);
    box-shadow:0 6px 18px rgba(14,124,118,0.12);
    transform:translateY(-2px);
  }
  .home-card-icon{width:48px;height:48px;margin-bottom:14px;}
  .home-card-title{
    font-family:'IBM Plex Sans Condensed', sans-serif;
    font-weight:600;
    font-size:17px;
    color:var(--ink);
    margin-bottom:8px;
  }
  .home-card-desc{
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .home-card-badge{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    font-weight:600;
    letter-spacing:0.6px;
    text-transform:uppercase;
    color:var(--ink-soft);
    background:var(--grey-wash);
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px 9px;
    margin-bottom:10px;
  }

  /* ---------- Data Analysis 101 ---------- */
  .da-intro-panel p{
    margin:0 0 10px;
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.6;
  }
  .da-intro-panel p:last-child{margin-bottom:0;}
  .da-legend{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid var(--line);
  }
  .da-legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);}
  .da-legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .da-legend-line{width:16px;height:0;border-top:2px dashed var(--da-pink);flex-shrink:0;}
  .da-feature{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    margin-top:16px;
    display:grid;
    grid-template-columns:1fr 1.3fr;
    gap:20px;
    align-items:center;
  }
  @media (max-width:760px){
    .da-feature{grid-template-columns:1fr;}
  }
  .da-feature-text h3{
    font-family:'IBM Plex Sans Condensed', sans-serif;
    font-size:14.5px;
    color:var(--teal-deep);
    margin:0 0 8px;
  }
  .da-feature-text p{
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.6;
    margin:0;
  }
  .da-feature-plot{
    background:#fbfdfc;
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px;
  }
  .da-row-label{
    font-family:'IBM Plex Sans Condensed', sans-serif;
    font-size:11px;
    letter-spacing:0.8px;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:20px 2px 8px;
  }
  .da-row-label:first-of-type{margin-top:20px;}
  .da-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:16px;
  }
  .da-grid.cols-2{grid-template-columns:repeat(2, 1fr);}
  @media (max-width:900px){
    .da-grid{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:600px){
    .da-grid{grid-template-columns:1fr;}
  }
  .da-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    min-width:0;
  }
  .da-card-title{
    font-family:'IBM Plex Sans Condensed', sans-serif;
    font-weight:600;
    font-size:13px;
    color:var(--ink);
    margin-bottom:8px;
  }
  .da-card-plot{
    background:#fbfdfc;
    border:1px solid var(--line);
    border-radius:7px;
    padding:8px;
    margin-bottom:10px;
  }
  .da-card-desc{
    font-size:11.5px;
    color:var(--ink-soft);
    line-height:1.55;
  }

  /* ---------- learning resources list ---------- */
  .resource-list{display:flex;flex-direction:column;gap:10px;}
  .resource-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:9px;
    padding:14px 16px;
    transition:border-color .15s, box-shadow .15s;
  }
  .resource-item:hover{
    border-color:var(--teal);
    box-shadow:0 3px 10px rgba(14,124,118,0.1);
  }
  .resource-icon{width:20px;height:20px;flex-shrink:0;}
  .resource-title{
    font-family:'IBM Plex Sans Condensed', sans-serif;
    font-weight:600;
    font-size:13.5px;
    color:var(--ink);
  }
  .resource-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--ink-soft);
    margin-top:2px;
  }

  /* ---------- support profile cards (dummy) ---------- */
  .profile-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:16px;
  }
  @media (max-width:560px){
    .profile-grid{grid-template-columns:1fr;}
  }
  .profile-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 16px;
    text-align:center;
  }
  .profile-avatar{
    width:52px;height:52px;
    border-radius:50%;
    background:var(--teal-wash);
    border:1px solid #bfe2dd;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 12px;
    font-family:'IBM Plex Sans Condensed', sans-serif;
    font-weight:600;
    font-size:15px;
    color:var(--teal-deep);
  }
  .profile-role{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.8px;
    text-transform:uppercase;
    color:var(--teal-deep);
    margin-bottom:4px;
  }
  .profile-name{
    font-family:'IBM Plex Sans Condensed', sans-serif;
    font-weight:600;
    font-size:15px;
    color:var(--ink);
    margin-bottom:10px;
  }
  .profile-contact{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    line-height:1.7;
  }
  .profile-desc{
    font-size:11px;
    color:var(--ink-soft);
    line-height:1.45;
    margin:6px 0 10px;
  }
  .profile-card.personal{
    border-color:var(--teal);
    box-shadow:0 0 0 1px var(--teal);
    position:relative;
  }
  .profile-card-badge{
    position:absolute;
    top:10px;right:10px;
    font-family:'IBM Plex Mono', monospace;
    font-size:9px;
    letter-spacing:0.6px;
    text-transform:uppercase;
    color:var(--teal-deep);
    background:var(--teal-wash);
    border:1px solid #bfe2dd;
    border-radius:999px;
    padding:2px 8px;
  }
  .profile-card-actions{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-top:12px;
  }
  .profile-card-actions button{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:11px;
    color:var(--teal-deep);
    background:none;
    border:none;
    cursor:pointer;
    padding:2px 4px;
  }
  .profile-card-actions button.danger{color:var(--red);}
  .fas-setup-panel{
    background:var(--panel);
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:18px;
    text-align:center;
  }
  .fas-setup-panel p{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0 0 12px;
    line-height:1.5;
  }
  .fas-form-fields{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    text-align:left;
    margin-top:14px;
  }
  @media (max-width:520px){
    .fas-form-fields{grid-template-columns:1fr;}
  }

  /* ---------- layout ---------- */
  .grid{
    display:grid;
    grid-template-columns: 300px 1fr;
    gap:18px;
    align-items:start;
  }
  @media (max-width:760px){
    .grid{grid-template-columns:1fr;}
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 18px 20px;
  }
  .panel h2{
    font-family:'IBM Plex Sans Condensed', sans-serif;
    font-size:13px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--teal-deep);
    margin:0 0 14px;
    font-weight:600;
  }

  /* ---------- inputs ---------- */
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:5px;
  }
  .field input[type=text], .field select{
    width:100%;
    border:1px solid var(--line);
    border-radius:7px;
    padding:9px 10px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--ink);
    background:#fafcfb;
    outline:none;
  }
  .field select{font-family:'IBM Plex Sans', sans-serif;cursor:pointer;}
  .field input:focus, .field select:focus{border-color:var(--teal);}
  .field .hint{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:4px;
    display:block;
  }
  .num-input{
    display:flex;
    align-items:center;
    border:1px solid var(--line);
    border-radius:7px;
    overflow:hidden;
    background:#fafcfb;
  }
  .num-input input{
    flex:1;
    border:none;
    background:none;
    padding:9px 10px;
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    color:var(--ink);
    width:100%;
    outline:none;
  }
  .num-input .unit{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    padding-right:10px;
  }
  .num-input:focus-within{border-color:var(--teal);}

  .toggle-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:9px 0;
  }
  .toggle-row label{font-size:12.5px;font-weight:600;color:var(--ink);}
  .switch{
    position:relative;width:38px;height:21px;flex-shrink:0;
  }
  .switch input{opacity:0;width:0;height:0;}
  .slider{
    position:absolute;cursor:pointer;inset:0;
    background:#c9d3cf;border-radius:999px;transition:.15s;
  }
  .slider:before{
    content:"";position:absolute;height:15px;width:15px;left:3px;top:3px;
    background:white;border-radius:50%;transition:.15s;
    box-shadow:0 1px 2px rgba(0,0,0,.25);
  }
  input:checked + .slider{background:var(--teal);}
  input:checked + .slider:before{transform:translateX(17px);}

  .assay-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:2px 10px;
  }
  .assay-item{
    display:flex;align-items:center;gap:8px;
    padding:6px 0;
  }
  .assay-item input[type=checkbox]{
    width:15px;height:15px;accent-color:var(--teal);cursor:pointer;
  }
  .assay-item label{font-size:12.5px;color:var(--ink);cursor:pointer;}
  .assay-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .assay-item.locked{opacity:0.4;}
  .assay-item.locked label{cursor:not-allowed;}
  .assay-item.locked input[type=checkbox]{cursor:not-allowed;}
  .assay-limit-note{
    font-size:11.5px;
    color:var(--ink-soft);
    background:#f2f6f5;
    border:1px solid var(--line);
    border-radius:6px;
    padding:6px 10px;
    margin-bottom:8px;
  }
  .assay-limit-note.at-limit{
    color:var(--teal-deep);
    background:var(--teal-wash);
    border-color:#bfe2dd;
    font-weight:600;
  }
  .mass-status{
    font-size:11.5px;
    border-radius:6px;
    padding:7px 10px;
    margin:-8px 0 16px;
    line-height:1.4;
  }
  .mass-status.ok{
    color:var(--teal-deep);
    background:var(--teal-wash);
    border:1px solid #bfe2dd;
  }
  .mass-status.warn{
    color:#8a5a12;
    background:#fbf1de;
    border:1px solid #ecd6a6;
  }
  .mass-status.error{
    color:var(--red);
    background:var(--red-wash);
    border:1px solid #eec4bd;
  }
  .info-note{
    font-size:11.5px;
    color:var(--ink-soft);
    background:#f2f6f5;
    border:1px solid var(--line);
    border-radius:6px;
    padding:8px 10px;
    margin-bottom:16px;
    line-height:1.4;
  }
  .segmented{
    display:flex;
    border:1px solid var(--line);
    border-radius:7px;
    overflow:hidden;
  }
  .segmented-btn{
    flex:1;
    border:none;
    background:#fafcfb;
    color:var(--ink-soft);
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:12.5px;
    padding:9px 8px;
    cursor:pointer;
    transition:.15s;
  }
  .segmented-btn + .segmented-btn{
    border-left:1px solid var(--line);
  }
  .segmented-btn:hover{color:var(--teal-deep);}
  .segmented-btn.active{
    background:var(--teal);
    color:#ffffff;
  }

  /* ---------- results ---------- */
  .aliquot-banner{
    display:flex;
    align-items:center;
    gap:16px;
    background:var(--teal-wash);
    border:1px solid #bfe2dd;
    border-radius:var(--radius);
    padding:14px 18px;
    margin-bottom:16px;
  }
  .aliquot-banner.error{
    background:var(--red-wash);
    border-color:#eec4bd;
  }
  .gauge-svg{width:46px;height:58px;flex-shrink:0;}
  .aliquot-text .num{
    font-family:'IBM Plex Mono', monospace;
    font-size:26px;
    font-weight:600;
    color:var(--teal-deep);
    line-height:1;
  }
  .aliquot-banner.error .aliquot-text .num{color:var(--red);}
  .aliquot-text .label{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:3px;
  }
  .aliquot-text .sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:6px;
  }

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{
    text-align:left;
    font-family:'IBM Plex Sans Condensed', sans-serif;
    font-size:10.5px;
    letter-spacing:0.6px;
    color:var(--ink-soft);
    padding:0 8px 8px;
    border-bottom:1px solid var(--line);
  }
  thead th.num, td.num{text-align:right;}
  tbody td{
    padding:8px 8px;
    border-bottom:1px solid #eef1f0;
    font-family:'IBM Plex Mono', monospace;
    color:var(--ink);
  }
  tbody td.label-cell{font-family:'IBM Plex Sans', sans-serif;font-weight:500;}
  tbody tr.total-row td{
    border-top:1.5px solid var(--ink);
    border-bottom:none;
    font-weight:600;
    padding-top:10px;
  }
  tbody tr.error-row td{color:var(--red);background:var(--red-wash);}
  .bar-track{
    width:64px;height:6px;background:#e3e9e7;border-radius:4px;overflow:hidden;
    display:inline-block;vertical-align:middle;margin-right:8px;
  }
  .bar-fill{height:100%;background:var(--teal);border-radius:4px;}

  .warning{
    margin-top:12px;
    font-size:12px;
    color:var(--red);
    background:var(--red-wash);

  .notes-panel p{
    margin:0;
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.6;
  }

    margin-top:26px;
    font-size:11px;
    color:var(--ink-soft);
    text-align:center;
  }

  .header-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:13px;
    border-radius:8px;
    padding:9px 16px;
    cursor:pointer;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    transition:.15s;
  }
  .btn:hover{border-color:var(--teal);color:var(--teal-deep);}
  .btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;}

  .btn.small{padding:6px 11px;font-size:12px;}
  .btn.danger{color:var(--red);}

    display:flex;
    gap:18px;
    align-items:center;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);

    margin-bottom:18px;
    font-size:12.5px;
    color:var(--ink-soft);
    flex-wrap:wrap;

  .legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;}
  .legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}

  .main-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:20px;
  }

  .chips-row{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:16px;
  }

  }

    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    min-width:0;
  }

  .chip-subtitle{font-family:'IBM Plex Mono', monospace;font-size:10px;color:var(--ink-soft);}
  .col-headers{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:5px;}
  .col-headers span{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    color:var(--ink-soft);
    text-align:center;
  }
  .well-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:repeat(8, auto);
    grid-auto-flow:column;
    gap:2px;
  }
  .well{
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--grey-wash);
    padding:5px 7px;
    cursor:pointer;
    text-align:left;
    font-family:inherit;
    transition:.1s;
    min-height:40px;
    position:relative;
    user-select:none;
    -webkit-user-select:none;
  }
  .well:hover{border-color:var(--teal);}
  .well.selected{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-wash);}
  .well-chamber{font-family:'IBM Plex Mono', monospace;font-size:10px;color:var(--ink-soft);font-weight:600;}
  .well-name{
    font-size:11px;
    font-weight:600;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-top:2px;

  .chip-actions{display:flex;gap:6px;margin-bottom:10px;}

    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
  }
  .editor-panel h2{
    font-family:'IBM Plex Sans Condensed', sans-serif;
    font-size:13px;
    letter-spacing:0.6px;
    text-transform:uppercase;
    color:var(--teal-deep);
    margin:0 0 4px;
  }
  .editor-sub{font-size:11.5px;color:var(--ink-soft);margin-bottom:16px;}
  .editor-fields-row{
    display:grid;
    grid-template-columns:1.6fr 1fr 1.6fr 1fr;
    gap:14px;
    align-items:start;
  }
  @media (max-width:800px){
    .editor-fields-row{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:480px){
    .editor-fields-row{grid-template-columns:1fr;}
  }
  .empty-state{
    font-size:12.5px;
    color:var(--ink-soft);
    text-align:center;
    padding:30px 10px;
    line-height:1.6;
  }
  .editor-footer-actions{
    display:flex;
    gap:8px;
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }

function individualTubeRows(state, rv, opts){
  opts = opts || {};
  const includeProbe = opts.includeProbe !== false;
  const targetFwd = state.targetFwd ?? 900;
  const targetRev = state.targetRev ?? 900;
  const targetProbe = state.targetProbe ?? 250;
  const tubeVol = (targetNM, stockUM)=>{
    const stock = (stockUM > 0) ? stockUM : 0.0001;
    return round4((targetNM * rv) / (stock * 1000));
  };
  const rows = [];
  let assaySum = 0;
  Object.keys(state.assays).forEach(name=>{
    if(!state.assays[name]) return;
    const stock = (state.assayStocks && state.assayStocks[name]) || {fwd:100, rev:100, probe:100};
    const fwdVol = tubeVol(targetFwd, stock.fwd);
    const revVol = tubeVol(targetRev, stock.rev);
    assaySum += fwdVol + revVol;
    rows.push({label:`${name} Forward Primer`, finalConc:`${fmt(targetFwd,0)} nM`, perRxn:fwdVol, inMastermix:true, assay:name});
    rows.push({label:`${name} Reverse Primer`, finalConc:`${fmt(targetRev,0)} nM`, perRxn:revVol, inMastermix:true, assay:name});
    if(includeProbe){
      const probeVol = tubeVol(targetProbe, stock.probe);
      assaySum += probeVol;
      rows.push({label:`${name} Probe`, finalConc:`${fmt(targetProbe,0)} nM`, perRxn:probeVol, inMastermix:true, assay:name});
    }
  });
  return {rows, assaySum};
}

function individualTubeRowsSingle(state, rv){
  const targetFwd = state.targetFwd ?? 250;
  const targetRev = state.targetRev ?? 250;
  const stockFwd = state.stockFwd ?? 100;
  const stockRev = state.stockRev ?? 100;
  const tubeVol = (targetNM, stockUM)=>{
    const stock = (stockUM > 0) ? stockUM : 0.0001;
    return round4((targetNM * rv) / (stock * 1000));
  };
  const fwdVol = tubeVol(targetFwd, stockFwd);
  const revVol = tubeVol(targetRev, stockRev);
  return {
    rows:[
      {label:"Forward Primer", finalConc:`${fmt(targetFwd,0)} nM`, perRxn:fwdVol, inMastermix:true},
      {label:"Reverse Primer", finalConc:`${fmt(targetRev,0)} nM`, perRxn:revVol, inMastermix:true},
    ],
    sum: fwdVol + revVol
  };
}

function probeMixComponents(opts){
  return function(state){
    const {reactionVolume:rv, sampleVolume, assays} = state;
    const supermix = rv/opts.bufferFactor;
    const rows = [
      {label:opts.supermixLabel, finalConc:"1X", perRxn:supermix, inMastermix:true},
    ];
    let assaySum = 0;
    if(state.individualTubes){
      const tubes = individualTubeRows(state, rv);
      rows.push(...tubes.rows);
      assaySum += tubes.assaySum;
    } else {
      Object.keys(assays).forEach(name=>{
        const v = assays[name] ? rv/20 : 0;
        assaySum += v;
        rows.push({label:`20X Primers/Probe Mix ${name}`, finalConc:"900 nM/250 nM", perRxn:v, inMastermix:true, assay:name});
      });
    }
    const enzymeVol = opts.enzymeVariable ? (state.enzymeVolume ?? round4(rv*opts.enzymeRatio)) : round4(rv*opts.enzymeRatio);
    const enzyme = state.digest ? enzymeVol : 0;
    const sample = sampleVolume;
    const water = rv - (supermix + assaySum + enzyme + sample);
    rows.push({label:"Diluted Restriction Enzyme", finalConc:"Variable", perRxn:enzyme, inMastermix:true});
    rows.push({label:"DNA", finalConc:null, perRxn:sample, inMastermix:false, isSample:true});
    rows.push({label:"RNase-/DNase-Free Water", finalConc:"—", perRxn:water, inMastermix:true});
    return rows;
  };
}

function naicaComponents(bufferFactor){
  return function(state){
    const {reactionVolume:rv, sampleVolume, assays} = state;
    const bufferA = rv/bufferFactor;
    const bufferBPct = state.bufferBPercent ?? 4;
    const bufferB = round4(rv * (bufferBPct/100));
    const rows = [
      {label:`naica ${bufferFactor}X Multiplex Supermix, Buffer A`, finalConc:"1X", perRxn:bufferA, inMastermix:true},
      {label:`naica ${bufferFactor}X Multiplex Supermix, Buffer B`, finalConc:`${fmt(bufferBPct)}%`, perRxn:bufferB, inMastermix:true},
    ];
    let assaySum = 0;
    if(state.individualTubes){
      const tubes = individualTubeRows(state, rv);
      rows.push(...tubes.rows);
      assaySum += tubes.assaySum;
    } else {
      Object.keys(assays).forEach(name=>{
        const v = assays[name] ? rv/20 : 0;
        assaySum += v;
        rows.push({label:`20X Primer/Probe Mix ${name}`, finalConc:"900 nM/250 nM", perRxn:v, inMastermix:true, assay:name});
      });
    }
    const sample = sampleVolume;
    const water = rv - (bufferA + bufferB + assaySum + sample);
    rows.push({label:"DNA", finalConc:null, perRxn:sample, inMastermix:false, isSample:true});
    rows.push({label:"Nuclease-Free Water", finalConc:"—", perRxn:water, inMastermix:true});
    return rows;
  };
}
function naicaProtocol(){

  ];
}

function naicaEvaGreenComponents(bufferFactor){
  return function(state){
    const {reactionVolume:rv, sampleVolume} = state;
    const bufferA = rv/bufferFactor;
    const bufferBPct = state.bufferBPercent ?? 4;
    const bufferB = round4(rv * (bufferBPct/100));
    const evaGreen = round4(rv * 0.075);
    const dextranDefault = round4(rv * 0.04);
    const dextran = state.includeDextran ? (state.dextranVolume ?? dextranDefault) : 0;
    const sample = sampleVolume;
    const rows = [
      {label:`naica ${bufferFactor}X PCR MIX, Buffer A`, finalConc:"1X", perRxn:bufferA, inMastermix:true},
      {label:`naica ${bufferFactor}X PCR MIX, Buffer B`, finalConc:`${fmt(bufferBPct)}%`, perRxn:bufferB, inMastermix:true},
      {label:"EvaGreen, 20X", finalConc:"1.5X", perRxn:evaGreen, inMastermix:true},
      {label:"Dextran Alexa Fluor 647 (reference dye)", finalConc: state.includeDextran ? "7.4 µg/mL" : "—", perRxn:dextran, inMastermix:true},
    ];
    let primerSum;
    if(state.individualTubes){
      const tubes = individualTubeRowsSingle(state, rv);
      rows.push(...tubes.rows);
      primerSum = tubes.sum;
    } else {
      const primer = rv/20;
      primerSum = primer;
      rows.push({label:"Primer Mix", finalConc:"250 nM (each)", perRxn:primer, inMastermix:true});
    }
    const water = rv - (bufferA + bufferB + evaGreen + dextran + primerSum + sample);
    rows.push({label:"DNA", finalConc:null, perRxn:sample, inMastermix:false, isSample:true});
    rows.push({label:"Nuclease-Free Water", finalConc:"—", perRxn:water, inMastermix:true});
    return rows;
  };
}

function round4(n){
  return Math.round(n * 10000) / 10000;
}

function fmt(n, d=2){
  if(!isFinite(n)) return "—";
  const r = Math.round(n*100)/100;
  return r.toFixed(d).replace(/\.00$/,"").replace(/(\.\d)0$/,"$1");
}

    return;
  }
  if(currentView === "placeholder"){
    renderPlaceholderContent();
    return;
  }
  const sheet = SHEETS.find(s=>s.id===activeTab);
  const s = state[sheet.id];
  const rows = sheet.components(s);
  rows.forEach(r=>{
    if(r.isSample) r.finalConc = sampleFinalConcText(sheet, s);
  });

  const mastermixRows = rows.filter(r=>r.inMastermix);
  const perRxnMastermixTotal = mastermixRows.reduce((a,r)=>a+r.perRxn,0);
  const totalMastermix = perRxnMastermixTotal * s.numReactions;
  const aliquotVolume = totalMastermix / s.numReactions; // per well, pre-sample
  const waterRow = rows.find(r=>r.label.includes("Water"));
  const isError = waterRow && waterRow.perRxn < -0.0001;

  const el = document.getElementById("tabContent");
  el.innerHTML = `
    <div class="grid">
      <div class="panel" id="inputsPanel"></div>

      <div>
        <div class="aliquot-banner ${isError?'error':''}">
          ${gaugeSvg(s.reactionVolume>0? Math.min(aliquotVolume/s.reactionVolume,1):0, isError)}
          <div class="aliquot-text">
            <div class="num">${isError? '—' : fmt(aliquotVolume)+' µL'}</div>
            <div class="label">Aliquot volume per well (mastermix only, before ${sheet.sampleLabel})</div>
            <div class="sub">Total mastermix: ${isError? '—' : fmt(totalMastermix)+' µL'} across ${s.numReactions} reactions</div>
          </div>
        </div>
        <div class="panel">
          <h2>Per-well breakdown</h2>
          ${componentsTable(rows, isError)}
          <div class="warning ${isError?'show':''}">
            DNA/RNA + mix components exceed the reaction volume — water volume is negative. Reduce sample volume, add more reaction volume, or trim assay count.
          </div>
        </div>
        <div class="panel protocol">
          <h2>Protocol</h2>
          <ol>${sheet.protocol.map(p=>`<li>${p}</li>`).join("")}</ol>
        </div>
        ${sheet.notes ? `<div class="panel notes-panel">
          <h2>Notes</h2>
          <p>${sheet.notes}</p>
        </div>` : ""}
      </div>
    </div>
  `;
  renderInputs(sheet, s);
}

function gaugeSvg(fraction, isError){
  const f = Math.max(0, Math.min(1, fraction));
  const fillH = 44 * f;
  const y = 6 + (44 - fillH);
  const color = isError ? "#c0392b" : "#0e7c76";
  return `<svg class="gauge-svg" viewBox="0 0 40 58" fill="none">
    <defs><clipPath id="clip-${activeTab}"><path d="M20 4C20 4 6 22 6 32a14 14 0 0 0 28 0C34 22 20 4 20 4Z"/></clipPath></defs>
    <path d="M20 4C20 4 6 22 6 32a14 14 0 0 0 28 0C34 22 20 4 20 4Z" fill="#e3e9e7" stroke="#c9d3cf"/>
    <rect x="0" y="${y}" width="40" height="${fillH}" fill="${color}" clip-path="url(#clip-${activeTab})" opacity="0.85"/>
  </svg>`;
}

function componentsTable(rows, isError){
  return `<table>
    <thead><tr>
      <th>COMPONENT</th><th>FINAL CONC.</th><th class="num">µL / RXN</th><th class="num">TOTAL µL</th>
    </tr></thead>
    <tbody>
      ${rows.map(r=>{
        const total = r.perRxn * state[activeTab].numReactions;
        const isWater = r.label.includes("Water");
        const errRow = isWater && isError;
        const dot = r.assay ? `<span class="assay-dot" style="background:${ASSAY_COLORS[r.assay]}"></span> ` : "";
        return `<tr class="${errRow?'error-row':''}">
          <td class="label-cell">${dot}${r.label}${r.isSample? ' <span style="color:var(--ink-soft);font-weight:400;">(added after aliquoting)</span>':''}</td>
          <td>${r.finalConc}</td>
          <td class="num">${fmt(r.perRxn)}</td>
          <td class="num">${fmt(total)}</td>
        </tr>`;
      }).join("")}
      <tr class="total-row">
        <td class="label-cell">Total reaction volume</td>
        <td></td>
        <td class="num">${fmt(rows.reduce((a,r)=>a+r.perRxn,0))}</td>
        <td class="num">${fmt(rows.reduce((a,r)=>a+r.perRxn,0) * state[activeTab].numReactions)}</td>
      </tr>
    </tbody>
  </table>`;
}

function formatMass(ng){
  if(ng < 0.001) return `${fmt(ng*1e6,1)} fg`;
  if(ng < 1) return `${fmt(ng*1000,1)} pg`;
  return `${fmt(ng,2)} ng`;
}

function sampleFinalConcText(sheet, s){
  if(s.sampleConcentration!=null && !isNaN(s.sampleConcentration)){
    const mass = s.sampleVolume * s.sampleConcentration;
    return formatMass(mass);
  }
  if(sheet.sampleFinalConcDisplay) return sheet.sampleFinalConcDisplay;
  const range = sheet.sampleMassRange;
  if(!range) return "Variable";
  if(range.min!=null && range.max!=null) return `${formatMass(range.min)}–${formatMass(range.max)}`;
  if(range.max!=null) return `Up to ${formatMass(range.max)}`;
  if(range.min!=null) return `Variable (\u2265${formatMass(range.min)} typical)`;
  return "Variable";
}

function massStatusEl(sheet, s){
  const range = sheet.sampleMassRange;
  const mass = s.sampleVolume * s.sampleConcentration; // ng
  let msg, cls;
  if(range.max!=null && mass > range.max){
    msg = `${formatMass(mass)} exceeds the recommended max of ${formatMass(range.max)} per reaction — consider diluting your sample.`;
    cls = "mass-status error";
  } else if(range.digestThreshold!=null && mass > range.digestThreshold && !s.digest){
    msg = `${formatMass(mass)} is above ${formatMass(range.digestThreshold)} — restriction digestion is recommended for this input. Consider enabling the digest toggle.`;
    cls = "mass-status warn";
  } else if(range.digestThreshold!=null && mass > range.digestThreshold && s.digest){
    msg = `${formatMass(mass)} — digestion is enabled, appropriate for this input.`;
    cls = "mass-status ok";
  } else if(range.min!=null && mass < range.min){
    msg = `${formatMass(mass)} is a very low input (below ~${formatMass(range.min)}) — just a heads-up that concentrations this low may be difficult to detect. This can still be intentional (e.g. rare-target work), so it's your call.`;
    cls = "mass-status warn";
  } else {
    msg = `${formatMass(mass)} — within the recommended input range.`;
    cls = "mass-status ok";
  }
  const div = document.createElement("div");
  div.className = cls;
  div.textContent = msg;
  return div;
}

function optionalNumField(labelText, unit, value, onChange, hint){
  const wrap = document.createElement("div");
  wrap.className = "field";
  const displayVal = (value===null || value===undefined) ? "" : value;
  wrap.innerHTML = `<label>${labelText}</label>
    <div class="num-input">
      <input type="text" inputmode="decimal" placeholder="optional" value="${displayVal}" data-field-key="${labelText}">
      <span class="unit">${unit}</span>
    </div>
    ${hint ? `<span class="hint">${hint}</span>` : ""}`;
  const inputEl = wrap.querySelector("input");
  inputEl.onchange = (e)=>{
    const raw = e.target.value;
    if(raw === ""){ onChange(null); return; }
    const v = parseFloat(raw);
    onChange(isNaN(v) ? null : v);
  };
  return wrap;
}

function computePrimerPrep(){
  const st = primerPrepState;
  const X = st.dilutionFactor;
  const vol = st.totalMixVolume;
  const cfg = st.chemistry === "probe" ? st.probe : st.evagreen;
  const components = st.chemistry === "probe"
    ? [
        {label:"Forward Primer", targetKey:"targetFwd", stockKey:"stockFwd"},
        {label:"Reverse Primer", targetKey:"targetRev", stockKey:"stockRev"},
        {label:"Probe",          targetKey:"targetProbe", stockKey:"stockProbe"},
      ]
    : [
        {label:"Forward Primer", targetKey:"targetFwd", stockKey:"stockFwd"},
        {label:"Reverse Primer", targetKey:"targetRev", stockKey:"stockRev"},
      ];
  const rows = components.map(c=>{
    const finalNM = cfg[c.targetKey];
    const target20X_uM = (finalNM * X) / 1000;
    const stock_uM = cfg[c.stockKey];
    const volNeeded = stock_uM > 0 ? (target20X_uM * vol) / stock_uM : NaN;
    const insufficient = !isFinite(volNeeded) || volNeeded > vol;
    return {label:c.label, finalNM, target20X_uM, stock_uM, volNeeded, insufficient};
  });
  const totalComponentVol = rows.reduce((a,r)=>a + (isFinite(r.volNeeded) ? r.volNeeded : 0), 0);
  const diluent = vol - totalComponentVol;
  const hasError = rows.some(r=>r.insufficient) || diluent < -0.0001;
  return {rows, diluent, vol, hasError};
}

function segmentedControl(labelText, options, value, onChange){
  const wrap = document.createElement("div");
  wrap.className = "field";
  const label = document.createElement("label");
  label.textContent = labelText;
  wrap.appendChild(label);
  const row = document.createElement("div");
  row.className = "segmented";
  options.forEach(opt=>{
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "segmented-btn" + (opt.value===value ? " active" : "");
    btn.textContent = opt.label;
    btn.onclick = ()=> onChange(opt.value);
    row.appendChild(btn);
  });
  wrap.appendChild(row);
  return wrap;
}

  const rows = result.rows.map(r=>{

function renderPrimerPrepInputs(){

function saveFocus(){
  const ae = document.activeElement;
  if(ae && ae.dataset && ae.dataset.fieldKey){
    return {
      key: ae.dataset.fieldKey,
      selStart: (typeof ae.selectionStart === "number") ? ae.selectionStart : null,
      selEnd: (typeof ae.selectionEnd === "number") ? ae.selectionEnd : null,
    };
  }
  return null;
}

function restoreFocus(saved){
  if(!saved) return;
  const escaped = saved.key.replace(/"/g, '\\"');
  const el = document.querySelector(`[data-field-key="${escaped}"]`);
  if(!el) return;
  el.focus();
  if(saved.selStart != null && el.setSelectionRange){
    try { el.setSelectionRange(saved.selStart, saved.selEnd); } catch(e){}
  }
}

function renderAll(){
  const saved = saveFocus();
  renderTabs();
  renderContent();
  restoreFocus(saved);
}

// Reads ?fasName=&fasEmail=&fasPhone= and ?aeName=&aeEmail=&aePhone= from the URL (once, on load).
// If present, saves each to localStorage and strips those params from the address bar
// so the link stays clean but the info persists across future visits and updates.
function captureFasFromURL(){
  const params = new URLSearchParams(window.location.search);
  let changed = false;
  PERSONAL_CONTACT_TYPES.forEach(type=>{
    const name = params.get(type.urlPrefix + "Name");
    if(!name) return;
    const contact = {
      role: type.role,
      name: name,
      email: params.get(type.urlPrefix + "Email") || "",
      phone: params.get(type.urlPrefix + "Phone") || "",
      initials: fasComputeInitials(name),
    };
    savePersonalContact(type.key, contact);
    params.delete(type.urlPrefix + "Name");
    params.delete(type.urlPrefix + "Email");
    params.delete(type.urlPrefix + "Phone");
    changed = true;
  });
  if(!changed) return;
  const cleanQuery = params.toString();
  const newUrl = window.location.pathname + (cleanQuery ? "?"+cleanQuery : "") + window.location.hash;
  window.history.replaceState(null, "", newUrl);
}

/* ============================================================
   PLATEMAP LABELER
   ============================================================ */
const PM_CHIPS = ["Left","Middle","Right"];
const PM_ROWS = ["A","B","C","D","E","F","G","H"];
const PM_COLS = [1,2];

const PM_SAMPLE_TYPES = [
  {value:"", label:"— (blank) —"},
  {value:"Unknown", label:"Unknown"},
  {value:"Known", label:"Known"},
  {value:"PositiveControl", label:"Positive Control"},
  {value:"NegativeControl", label:"Negative Control"},
];

function pmChamberOrder(){
  const list = [];
  PM_COLS.forEach(col=>{
    PM_ROWS.forEach(row=>{
      list.push(row + col);
    });
  });
  return list;
}
const PM_CHAMBERS = pmChamberOrder(); // A1,B1,...,H1,A2,...,H2

function pmWellKey(chip, chamber){ return chip + "-" + chamber; }

const pmWells = {};
PM_CHIPS.forEach(chip=>{
  PM_CHAMBERS.forEach(chamber=>{
    pmWells[pmWellKey(chip, chamber)] = { sampleName:"", sampleType:"", context:"", dilution:null };
  });
});

let pmSelected = new Set(); // well keys
let pmLastClicked = null; // anchor for shift-range select, per chip
let pmIsDragging = false;
let pmDragChip = null;       // which chip the current drag started in
let pmDragAnchorChamber = null; // chamber the drag started from
let pmDragBase = new Set();  // selection to preserve underneath an additive (ctrl/cmd) drag

function pmParseChamber(chamber){
  const m = chamber.match(/^([A-H])(\d+)$/);
  return { row: m[1], col: parseInt(m[2], 10) };
}

function pmRangeChambers(chip, chamberA, chamberB){
  const a = pmParseChamber(chamberA);
  const b = pmParseChamber(chamberB);
  const rowIdxA = PM_ROWS.indexOf(a.row), rowIdxB = PM_ROWS.indexOf(b.row);
  const colIdxA = PM_COLS.indexOf(a.col), colIdxB = PM_COLS.indexOf(b.col);
  const [rowStart, rowEnd] = rowIdxA < rowIdxB ? [rowIdxA, rowIdxB] : [rowIdxB, rowIdxA];
  const [colStart, colEnd] = colIdxA < colIdxB ? [colIdxA, colIdxB] : [colIdxB, colIdxA];
  const out = [];
  for(let r = rowStart; r <= rowEnd; r++){
    for(let c = colStart; c <= colEnd; c++){
      out.push(pmWellKey(chip, PM_ROWS[r] + PM_COLS[c]));
    }
  }
  return out;
}

function pmHandleWellMouseDown(key, chip, e){
  const chamber = key.split("-")[1];

  if(e.shiftKey && pmLastClicked && pmLastClicked.chip === chip){
    pmRangeChambers(chip, pmLastClicked.chamber, chamber).forEach(k => pmSelected.add(k));
    renderPlatemapAll();
    return;
  }

  // Start a fresh drag. Ctrl/Cmd keeps the existing selection underneath
  // and adds the new drag range on top; a plain click starts a brand-new
  // selection, replacing whatever was selected before.
  pmDragBase = (e.metaKey || e.ctrlKey) ? new Set(pmSelected) : new Set();
  pmDragChip = chip;
  pmDragAnchorChamber = chamber;
  pmIsDragging = true;
  pmSelected = new Set([...pmDragBase, key]);
  pmLastClicked = { chip, chamber };
  renderPlatemapAll();
}

function pmHandleWellMouseEnter(key, chip){
  if(!pmIsDragging || chip !== pmDragChip) return;
  const chamber = key.split("-")[1];
  const range = pmRangeChambers(pmDragChip, pmDragAnchorChamber, chamber);
  pmSelected = new Set([...pmDragBase, ...range]);
  renderPlatemapAll();
}

document.addEventListener("mouseup", ()=>{
  pmIsDragging = false;
  pmDragChip = null;
  pmDragAnchorChamber = null;
  pmDragBase = new Set();
});

function pmSelectAllInChip(chip){
  PM_CHAMBERS.forEach(chamber=> pmSelected.add(pmWellKey(chip, chamber)));
  renderPlatemapAll();
}
function pmClearSelection(){
  pmSelected = new Set();
  renderPlatemapAll();
}
function pmClearWells(keys){
  keys.forEach(k=>{
    pmWells[k] = { sampleName:"", sampleType:"", context:"", dilution:null };
  });
  renderPlatemapAll();
}
function pmClearAll(){
  if(!confirm("Clear every well on the plate? This can't be undone.")) return;
  Object.keys(pmWells).forEach(k=>{
    pmWells[k] = { sampleName:"", sampleType:"", context:"", dilution:null };
  });
  pmSelected = new Set();
  renderPlatemapAll();
}

function pmSharedValue(field){
  const keys = Array.from(pmSelected);
  if(keys.length === 0) return { value:"", mixed:false };
  const first = pmWells[keys[0]][field];
  const mixed = keys.some(k => pmWells[k][field] !== first);
  return { value: mixed ? "" : (first ?? ""), mixed };
}

function pmApplyToSelection(field, value){
  pmSelected.forEach(k=>{ pmWells[k][field] = value; });
  renderPlatemapAll();
}

function pmCsvField(v){
  if(v === null || v === undefined) return "";
  const s = String(v);
  if(/[",\r\n]/.test(s)){
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

function pmBuildCSV(){
  const header = ["Chip Position","Chamber","Chip ID","Sample Name","Sample Type","Context","Dilution"];
  const lines = [header.join(",")];
  PM_CHIPS.forEach(chip=>{
    PM_CHAMBERS.forEach(chamber=>{
      const w = pmWells[pmWellKey(chip, chamber)];
      const row = [
        chip,
        chamber,
        "",
        pmCsvField(w.sampleName),
        pmCsvField(w.sampleType),
        pmCsvField(w.context),
        w.dilution === null || w.dilution === undefined || isNaN(w.dilution) ? "" : String(w.dilution),
      ];
      lines.push(row.join(","));
    });
  });
  return lines.join("\r\n") + "\r\n";
}

function pmExportCSV(){
  const csv = pmBuildCSV();
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "platemap_export.csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function pmEscapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function pmEscapeAttr(s){
  return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;");
}

    PM_CHAMBERS.forEach(chamber=>{
      const key = pmWellKey(chip, chamber);
      const w = pmWells[key];
      const btn = document.createElement("button");
      const typeClass = w.sampleType ? ` type-${w.sampleType}` : "";
      btn.className = "well" + typeClass + (pmSelected.has(key) ? " selected" : "");
      btn.innerHTML = `<div class="well-chamber">${chamber}</div><div class="well-name">${w.sampleName ? pmEscapeHtml(w.sampleName) : "&nbsp;"}</div>`;
      btn.onmousedown = (e)=>{ e.preventDefault(); pmHandleWellMouseDown(key, chip, e); };
      btn.onmouseenter = ()=> pmHandleWellMouseEnter(key, chip);
      grid.appendChild(btn);
    });
    panel.appendChild(grid);
    el.appendChild(panel);
  });
}

    </div>
  `;

  const typeSelect = document.getElementById("pmFieldSampleType");
  PM_SAMPLE_TYPES.forEach(opt=>{
    const o = document.createElement("option");
    o.value = opt.value;
    o.textContent = type.mixed && opt.value==="" ? "(multiple values)" : opt.label;
    if(!type.mixed && opt.value === type.value) o.selected = true;
    typeSelect.appendChild(o);
  });

  document.getElementById("pmFieldSampleName").onchange = (e)=> pmApplyToSelection("sampleName", e.target.value);
  document.getElementById("pmFieldSampleType").onchange = (e)=> pmApplyToSelection("sampleType", e.target.value);
  document.getElementById("pmFieldContext").onchange = (e)=> pmApplyToSelection("context", e.target.value);
  document.getElementById("pmFieldDilution").onchange = (e)=>{
    const raw = e.target.value.trim();
    if(raw === ""){ pmApplyToSelection("dilution", null); return; }
    const v = parseFloat(raw);
    pmApplyToSelection("dilution", isNaN(v) ? null : v);
  };
  document.getElementById("pmClearSelBtn").onclick = ()=> pmClearWells(Array.from(pmSelected));
  document.getElementById("pmDeselectBtn").onclick = pmClearSelection;
}

/* ============================================================
   DATA ANALYSIS 101 — illustrative droplet amplitude plots
   ============================================================ */
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function daGaussian(rng, mean, sd){
  const u = Math.max(rng(), 1e-6);
  const v = rng();
  const z = Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v);
  return mean + z*sd;
}
function daMakeWell(seed, opts){
  const {nNeg=0, nPos=0, nRain=0, negMean=3100, negSD=220, posMean=8500, posSD=260, rainMin=4300, rainMax=7100} = opts;
  const rng = mulberry32(seed);
  const points = [];
  for(let i=0;i<nNeg;i++) points.push({rfu: Math.max(150, daGaussian(rng, negMean, negSD)), positive:false});
  for(let i=0;i<nPos;i++) points.push({rfu: Math.min(10200, daGaussian(rng, posMean, posSD)), positive:true});
  for(let i=0;i<nRain;i++) points.push({rfu: rainMin + rng()*(rainMax-rainMin), positive:false, rain:true});
  for(let i=points.length-1;i>0;i--){
    const j = Math.floor(rng()*(i+1));
    [points[i], points[j]] = [points[j], points[i]];
  }
  points.forEach((p,i)=> p.event = i+1);
  return points;
}

function daScatterSvg(points, opts){
  opts = opts || {};
  const w = opts.width || 300, h = opts.height || 180;
  const annotate = !!opts.annotate;
  const mL = 34, mR = 10, mT = annotate ? 20 : 12, mB = 22;
  const plotW = w - mL - mR, plotH = h - mT - mB;
  const xMax = points.length + 1;
  const yMax = 10500;
  const thresholdY = mT + plotH - (DA101_THRESHOLD/yMax)*plotH;

  const dots = points.map(p=>{
    const x = mL + (p.event/xMax)*plotW;
    const y = mT + plotH - (Math.max(0,p.rfu)/yMax)*plotH;
    const fill = p.rain ? "var(--da-rain)" : (p.positive ? "var(--blue)" : "var(--da-neg)");
    const r = points.length > 150 ? 1.7 : 2.6;
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${fill}" opacity="0.85"/>`;
  }).join("");

  let annotations = "";
  if(annotate){
    annotations += `<text x="${mL+2}" y="${mT+2}" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="var(--blue)" font-weight="600">POSITIVE</text>`;
    annotations += `<text x="${mL+2}" y="${h-mB+14}" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#6d7975" font-weight="600">NEGATIVE</text>`;
    annotations += `<text x="${w-mR-64}" y="${thresholdY-6}" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="var(--da-pink)" font-weight="600">THRESHOLD</text>`;
  }

  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;">
    <line x1="${mL}" y1="${mT}" x2="${mL}" y2="${h-mB}" stroke="var(--line)" stroke-width="1"/>
    <line x1="${mL}" y1="${h-mB}" x2="${w-mR}" y2="${h-mB}" stroke="var(--line)" stroke-width="1"/>
    <line x1="${mL}" y1="${thresholdY.toFixed(1)}" x2="${w-mR}" y2="${thresholdY.toFixed(1)}" stroke="var(--da-pink)" stroke-width="1.4" stroke-dasharray="4,3"/>
    ${dots}
    ${annotations}
    <text x="${(mL+w-mR)/2}" y="${h-5}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="var(--ink-soft)">Droplet Event</text>
    <text x="9" y="${mT-2 > 8 ? mT-2 : 8}" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="var(--ink-soft)">RFU</text>
  </svg>`;
}
