function daScatterSvg(points, opts){
  opts = opts || {};
  const w = opts.width || 300, h = opts.height || 180;
  const annotate = !!opts.annotate;
  const mL = 34, mR = 10, mT = annotate ? 20 : 12, mB = 22;
  const plotW = w - mL - mR, plotH = h - mT - mB;
  const xMax = points.length + 1;
  const yMax = 10500;
  const thresholdY = mT + plotH - (DA101_THRESHOLD/yMax)*plotH;

  const dots = points.map(p=>{
    const x = mL + (p.event/xMax)*plotW;
    const y = mT + plotH - (Math.max(0,p.rfu)/yMax)*plotH;
    const fill = p.rain ? "var(--da-rain)" : (p.positive ? "var(--blue)" : "var(--da-neg)");
    const r = points.length > 150 ? 1.7 : 2.6;
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${fill}" opacity="0.85"/>`;
  }).join("");

  let annotations = "";
  if(annotate){
    annotations += `<text x="${mL+2}" y="${mT+2}" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="var(--blue)" font-weight="600">POSITIVE</text>`;
    annotations += `<text x="${mL+2}" y="${h-mB+14}" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#6d7975" font-weight="600">NEGATIVE</text>`;
    annotations += `<text x="${w-mR-64}" y="${thresholdY-6}" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="var(--da-pink)" font-weight="600">THRESHOLD</text>`;
  }

  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;">
    <line x1="${mL}" y1="${mT}" x2="${mL}" y2="${h-mB}" stroke="var(--line)" stroke-width="1"/>
    <line x1="${mL}" y1="${h-mB}" x2="${w-mR}" y2="${h-mB}" stroke="var(--line)" stroke-width="1"/>
    <line x1="${mL}" y1="${thresholdY.toFixed(1)}" x2="${w-mR}" y2="${thresholdY.toFixed(1)}" stroke="var(--da-pink)" stroke-width="1.4" stroke-dasharray="4,3"/>
    ${dots}
    ${annotations}
    <text x="${(mL+w-mR)/2}" y="${h-5}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="var(--ink-soft)">Droplet Event</text>
    <text x="9" y="${mT-2 > 8 ? mT-2 : 8}" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="var(--ink-soft)">RFU</text>
  </svg>`;
}

        {id:"posKnown", label:"Known positive sample", placeholder:"e.g. Patient sample #12, confirmed positive"},
        {id:"posSynthetic", label:"Synthetic or reference material", placeholder:"e.g. gBlock standard, 500 copies/µL"},
      ]
    },
    {
      id:"negative", title:"Negative Controls",
      items:[
        {id:"negNTC", label:"No-template control (NTC)", placeholder:"e.g. Nuclease-free water, one per plate"},
        {id:"negKnown", label:"Known negative sample", placeholder:"e.g. Healthy donor plasma"},
        {id:"negBlank", label:"Extraction blank (if applicable)", placeholder:"e.g. Water carried through extraction"},
      ]
    },
    {
      id:"quant", title:"Quantification Controls",
      items:[
        {id:"quantRef", label:"Reference assay required", placeholder:"e.g. RPP30 for input normalization"},
        {id:"quantInternal", label:"Internal control required", placeholder:"e.g. Spiked synthetic internal standard"},
      ]
    },
  ]
};

const PLANNER_READY_ITEMS = [
  {id:"r_question", label:"Question defined"},
  {id:"r_targets", label:"Targets selected"},
  {id:"r_samples", label:"Samples identified"},
  {id:"r_extraction", label:"Extraction method chosen"},
  {id:"r_assays", label:"Assays selected"},
  {id:"r_controls", label:"Controls planned"},
  {id:"r_replicates", label:"Replicates planned"},
  {id:"r_success", label:"Success criteria defined"},
];

const plannerState = {
  meta:{ name:"", date:todayStr() },
  answers:{},   // question item id -> free text
  controls:{},  // control item id -> {checked:bool, note:string}
  ready:{}      // ready-check id -> bool
};

function plannerAnswerCount(){
  let total = 0, filled = 0;
  PLANNER_QUESTION_SECTIONS.forEach(sec=>{
    sec.items.forEach(item=>{
      total++;
      if((plannerState.answers[item.id]||"").trim() !== "") filled++;
    });
  });
  return {filled, total};
}
function plannerControlsCount(){
  let total = 0, checked = 0;
  PLANNER_CONTROLS_SECTION.groups.forEach(g=>{
    g.items.forEach(item=>{
      total++;
      if(plannerState.controls[item.id] && plannerState.controls[item.id].checked) checked++;
    });
  });
  return {checked, total};
}
function plannerReadyCount(){
  const total = PLANNER_READY_ITEMS.length;
  const checked = PLANNER_READY_ITEMS.filter(item=>plannerState.ready[item.id]).length;
  return {checked, total};
}

function plannerResetAll(){
  if(!confirm("Reset the entire experiment planner? This clears every answer, control, and checklist item.")) return;
  plannerState.meta = { name:"", date:todayStr() };
  plannerState.answers = {};
  plannerState.controls = {};
  plannerState.ready = {};
  renderAll();
}

function renderPlannerContent(){
  const el = document.getElementById("tabContent");
  const answerStats = plannerAnswerCount();
  const controlStats = plannerControlsCount();
  const readyStats = plannerReadyCount();
  const readyPct = readyStats.total > 0 ? Math.round((readyStats.checked/readyStats.total)*100) : 0;

  el.innerHTML = `
    <div class="panel planner-intro-panel">
      <h2>ddPCR Experiment Planner</h2>
      <p>Inspired by the digital MIQE guidelines, this is a running checklist to think through your experiment <em>before</em> ordering assays, extracting samples, or running reactions. Answer what you can now and come back to fill in the rest — nothing here is graded, it's just a prompt to catch gaps early.</p>
      <p>Nothing is saved between visits — treat this as a working scratchpad for the current planning session, and copy your answers into your lab notebook or ELN when you're done.</p>
    </div>

    <div class="header-actions no-print" style="justify-content:flex-end;margin-bottom:14px;">
      <button class="btn" id="plannerPrintBtn">Print This Plan</button>
      <button class="btn danger" id="plannerResetBtn">Reset Planner</button>
    </div>

    <div class="planner-progress-bar">
      <span><strong>${answerStats.filled}</strong> of <strong>${answerStats.total}</strong> planning questions answered</span>
      <span><strong>${controlStats.checked}</strong> of <strong>${controlStats.total}</strong> controls planned</span>
      <span style="margin-left:auto;display:flex;align-items:center;gap:8px;">
        <span><strong>${readyStats.checked}</strong> of <strong>${readyStats.total}</strong> ready to run</span>
        <span class="planner-progress-track"><span class="planner-progress-fill" style="width:${readyPct}%"></span></span>
      </span>
    </div>

    <div id="plannerSections"></div>

    <div class="planner-section" id="plannerReadySection"></div>
  `;

  document.getElementById("plannerPrintBtn").onclick = printPlannerDirect;
  document.getElementById("plannerResetBtn").onclick = plannerResetAll;

  const sectionsEl = document.getElementById("plannerSections");
  PLANNER_QUESTION_SECTIONS.forEach(sec=>{
    if(sec.num === 6){ /* not used, controls occupies slot 6 */ }
    sectionsEl.appendChild(renderPlannerQuestionSection(sec));
    if(sec.num === 5){
      // Controls section (6) is interleaved between Assay Strategy (5) and Workflow (7)
      sectionsEl.appendChild(renderPlannerControlsSection());
    }
  });

  renderPlannerReadySection();

  // auto-grow every planner textarea to fit its current content
  sectionsEl.querySelectorAll(".planner-textarea").forEach(ta=> autoGrowTextarea(ta));
}

function renderPlannerQuestionSection(sec){
  const wrap = document.createElement("div");
  wrap.className = "planner-section";
  wrap.innerHTML = `
    <div class="planner-section-header">
      <span class="planner-section-num">${sec.num}</span>
      <span class="planner-section-title">${sec.title}</span>
    </div>
    ${sec.desc ? `<div class="planner-section-desc">${sec.desc}</div>` : ""}
  `;
  sec.items.forEach(item=>{
    const field = document.createElement("div");
    field.className = "planner-item";
    field.innerHTML = `<label for="${item.id}">${item.label}</label>
      <textarea class="planner-textarea" id="${item.id}" rows="1" placeholder="${pmEscapeAttr(item.placeholder||"")}" data-field-key="${item.id}">${pmEscapeHtml(plannerState.answers[item.id]||"")}</textarea>`;
    const ta = field.querySelector("textarea");
    ta.addEventListener("input", ()=> autoGrowTextarea(ta));
    ta.onchange = (e)=>{ plannerState.answers[item.id] = e.target.value; };
    wrap.appendChild(field);
  });
  return wrap;
}

function renderPlannerControlsSection(){
  const sec = PLANNER_CONTROLS_SECTION;
  const wrap = document.createElement("div");
  wrap.className = "planner-section";
  wrap.innerHTML = `
    <div class="planner-section-header">
      <span class="planner-section-num">${sec.num}</span>
      <span class="planner-section-title">${sec.title}</span>
    </div>
    <div class="planner-section-desc">Check off each control you're planning to include, and jot down what it will be.</div>
  `;
  sec.groups.forEach(group=>{
    const groupEl = document.createElement("div");
    groupEl.className = "planner-control-group";
    const groupTitle = document.createElement("div");
    groupTitle.className = "planner-control-group-title";
    groupTitle.textContent = group.title;
    groupEl.appendChild(groupTitle);
    group.items.forEach(item=>{
      if(!plannerState.controls[item.id]) plannerState.controls[item.id] = {checked:false, note:""};
      const state = plannerState.controls[item.id];
      const row = document.createElement("div");
      row.className = "planner-control-row";
      const cbId = "ctrl-"+item.id;
      const noteId = "ctrl-note-"+item.id;
      row.innerHTML = `
        <input type="checkbox" id="${cbId}" ${state.checked?'checked':''} data-field-key="${cbId}">
        <label for="${cbId}">${item.label}</label>
        <input type="text" id="${noteId}" value="${pmEscapeAttr(state.note)}" placeholder="${pmEscapeAttr(item.placeholder||"")}" data-field-key="${noteId}">
      `;
      row.querySelector("input[type=checkbox]").onchange = (e)=>{ state.checked = e.target.checked; };
      row.querySelector("input[type=text]").onchange = (e)=>{ state.note = e.target.value; };
      groupEl.appendChild(row);
    });
    wrap.appendChild(groupEl);
  });
  return wrap;
}

function renderPlannerReadySection(){
  const wrap = document.getElementById("plannerReadySection");
  const stats = plannerReadyCount();
  const allChecked = stats.checked === stats.total;
  wrap.innerHTML = `
    <div class="planner-section-header">
      <span class="planner-section-num">&#10003;</span>
      <span class="planner-section-title">Ready to Run?</span>
    </div>
    <div class="planner-section-desc">Before beginning, confirm each item below. If any box remains unchecked, the experiment design may need additional planning before proceeding.</div>
    <div id="plannerReadyRows"></div>
    <div class="planner-ready-banner ${allChecked ? 'ok' : 'pending'}">
      ${allChecked
        ? "All planning items confirmed \u2014 you're ready to move on to sample extraction and mastermix setup."
        : `${stats.total - stats.checked} item${stats.total-stats.checked===1?"":"s"} still unconfirmed \u2014 review the sections above before ordering assays or running reactions.`}
    </div>
  `;
  const rowsEl = document.getElementById("plannerReadyRows");
  PLANNER_READY_ITEMS.forEach(item=>{
    const row = document.createElement("div");
    row.className = "planner-ready-row";
    const id = "ready-"+item.id;
    row.innerHTML = `<input type="checkbox" id="${id}" ${plannerState.ready[item.id]?'checked':''} data-field-key="${id}">
      <label for="${id}">${item.label}</label>`;
    row.querySelector("input").onchange = (e)=>{ plannerState.ready[item.id] = e.target.checked; renderAll(); };
    rowsEl.appendChild(row);
  });
}

// Builds a standalone, printable rendering of the whole planner (every
// question, its answer or "(not answered)", the controls checklist, and
// the final Ready to Run checklist) for direct printing from this module.
function buildPlannerPrintHtml(){
  let html = `<div class="exp-block">`;
  html += `<h3 class="exp-block-title">ddPCR Experiment Planning Checklist</h3>`;
  html += `<div class="exp-block-sub">Printed ${pmEscapeHtml(todayStr())}</div>`;

  PLANNER_QUESTION_SECTIONS.forEach(sec=>{
    html += `<div class="planner-print-section-h">${sec.num}. ${pmEscapeHtml(sec.title)}</div>`;
    sec.items.forEach(item=>{
      const answer = (plannerState.answers[item.id]||"").trim();
      html += `<div class="planner-print-q">${pmEscapeHtml(item.label)}</div>`;
      html += `<div class="planner-print-a${answer?"":" empty"}">${answer ? pmEscapeHtml(answer) : "(not answered)"}</div>`;
    });
    if(sec.num === 5){
      html += `<div class="planner-print-section-h">${PLANNER_CONTROLS_SECTION.num}. ${pmEscapeHtml(PLANNER_CONTROLS_SECTION.title)}</div>`;
      PLANNER_CONTROLS_SECTION.groups.forEach(group=>{
        html += `<div class="planner-print-group-h">${pmEscapeHtml(group.title)}</div>`;
        group.items.forEach(item=>{
          const cs = plannerState.controls[item.id] || {checked:false, note:""};
          const note = (cs.note||"").trim();
          html += `<div class="planner-print-check">${cs.checked ? "\u2611" : "\u2610"} ${pmEscapeHtml(item.label)}${note ? " \u2014 " + pmEscapeHtml(note) : ""}</div>`;
        });
      });
    }
  });

  html += `<div class="planner-print-section-h">Ready to Run?</div>`;
  PLANNER_READY_ITEMS.forEach(item=>{
    html += `<div class="planner-print-check">${plannerState.ready[item.id] ? "\u2611" : "\u2610"} ${pmEscapeHtml(item.label)}</div>`;
  });

  html += `</div>`;
  return html;
}

function printPlannerDirect(){
  printHtmlString(buildPlannerPrintHtml(), "ddPCR Experiment Planner");
}

/* ============================================================
   FIRST-VISIT DISCLAIMER MODAL — reminds people these are
   unofficial, unaffiliated tools before they start using them.
   ============================================================ */
const DISCLAIMER_STORAGE_KEY = "ddpcr_disclaimerAck_v1";
const DISCLAIMER_SNOOZE_MS = 30 * 24 * 60 * 60 * 1000; // 30 days

function hasAckedDisclaimer(){
  try{
    const raw = localStorage.getItem(DISCLAIMER_STORAGE_KEY);
    if(!raw) return false;
    const until = parseInt(raw, 10);
    if(!isFinite(until)) return false;
    return Date.now() < until;
  }catch(e){ return false; }
}
function ackDisclaimer(dontShowAgain){
  try{
    if(dontShowAgain) localStorage.setItem(DISCLAIMER_STORAGE_KEY, String(Date.now() + DISCLAIMER_SNOOZE_MS));
  }catch(e){}
  const overlay = document.getElementById("disclaimerOverlay");
  if(overlay) overlay.innerHTML = "";
}

function renderDisclaimerModal(){
  if(hasAckedDisclaimer()) return;
  const overlay = document.getElementById("disclaimerOverlay");
  if(!overlay) return;
  overlay.innerHTML = `
    <div class="disclaimer-overlay" id="disclaimerBackdrop">
      <div class="disclaimer-modal" role="dialog" aria-modal="true" aria-labelledby="disclaimerTitle">
        <div class="disclaimer-modal-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c98a1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </div>
        <h2 id="disclaimerTitle">Disclaimer</h2>
        <p>This site is an independent, unofficial set of calculators and utilities for QX700 ddPCR workflows.</p>
        <p>Always double-check every calculation against the official product inserts and your own lab's validated protocols before using it in an experiment.</p>
        <div class="disclaimer-dont-show">
          <input type="checkbox" id="disclaimerDontShow">
          <label for="disclaimerDontShow">Don't show this again for 30 days on this device.</label>
        </div>
        <div class="disclaimer-modal-actions">
          <button class="btn primary" id="disclaimerAckBtn">I understand.</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById("disclaimerAckBtn").onclick = ()=>{
    const dontShow = document.getElementById("disclaimerDontShow").checked;
    ackDisclaimer(dontShow);
  };
}
