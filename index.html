<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAS QX700 ddPCR WebApps &amp; Calculators - Beta Build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #eef2f0;
    --panel: #ffffff;
    --ink: #10201d;
    --ink-soft: #4b5f5a;
    --line: #d6e0dc;
    --teal: #0e7c76;
    --teal-deep: #085a56;
    --teal-wash: #e3f2f0;
    --amber: #c98a1e;
    --amber-wash: #fbf1de;
    --red: #c0392b;
    --red-wash: #fbe9e7;
    --blue: #2e6da4;
    --blue-wash: #e6eef5;
    --grey-wash: #eef0ef;
    --radius: 10px;
    --da-pink: #d1428f;
    --da-neg: #98a29c;
    --da-rain: #c98a1e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    padding:28px 20px 60px;
  }
  .wrap{max-width:980px;margin:0 auto;}

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .brand-mark{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .droplet-logo{width:34px;height:34px;flex-shrink:0;}
  h1{
    font-family:'IBM Plex Sans Condensed', sans-serif;
    font-weight:600;
    font-size:22px;
    letter-spacing:0.2px;
    margin:0;
    color:var(--ink);
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--teal-deep);
    margin:0 0 2px;
  }
  .source-note{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    text-align:right;
  }
  .version-badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    font-weight:500;
    color:var(--ink-soft);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px 11px;
    flex-shrink:0;
    white-space:nowrap;
  }

  /* ---------- tabs ---------- */
  .tabs{
    display:flex;
    gap:6px;
    border-bottom:2px solid var(--line);
    margin-bottom:20px;
    overflow-x:auto;
  }
  .tab-btn{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:13.5px;
    color:var(--ink-soft);
    background:none;
    border:none;
    padding:10px 16px 12px;
    cursor:pointer;
    white-space:nowrap;
    border-bottom:2px solid transparent;
    margin-bottom:-2px;
    transition:color .15s;
  }
  .tab-btn:hover{color:var(--teal-deep);}
  .tab-btn.active{
    color:var(--teal-deep);
    border-bottom-color:var(--teal);
  }

  /* ---------- nav (back button / sheet dropdown) ---------- */
  .tabs.nav-bar{
    border-bottom:none;
    align-items:center;
    gap:10px 14px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .back-btn{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:13px;
    color:var(--teal-deep);
    background:var(--teal-wash);
    border:1px solid #bfe2dd;
    border-radius:7px;
    padding:8px 14px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s;
  }
  .back-btn:hover{background:#d3e9e6;}
  .sheet-select{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:13.5px;
    color:var(--ink);
    background:#fafcfb;
    border:1px solid var(--line);
    border-radius:7px;
    padding:8px 12px;
    cursor:pointer;
    flex:1;
    max-width:420px;
  }
  .module-nav-strip{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }
  .module-nav-icon{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#fafcfb;
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px;
    max-width:36px;
    overflow:hidden;
    cursor:pointer;
    white-space:nowrap;
    transition:max-width .25s ease, background .15s, border-color .15s;
  }
  .module-nav-icon:hover,
  .module-nav-icon:focus-visible{
    max-width:280px;
    background:var(--teal-wash);
    border-color:#bfe2dd;
    outline:none;
  }
  .module-nav-icon-svg{
    width:20px;
    height:20px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .module-nav-icon-svg svg{width:20px;height:20px;}
  .module-nav-icon-label{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:12.5px;
    color:var(--teal-deep);
    opacity:0;
    transition:opacity .12s ease;
  }
  .module-nav-icon:hover .module-nav-icon-label,
  .module-nav-icon:focus-visible .module-nav-icon-label{
    opacity:1;
    transition:opacity .18s ease .08s;
  }
  .module-nav-icon.is-current{
    background:var(--teal-wash);
    border-color:var(--teal);
    cursor:default;
    max-width:280px; /* stay expanded — this is where you are */
    padding:7px 12px 7px 7px;
  }
  .module-nav-icon.is-current .module-nav-icon-label{
    opacity:1;
  }
  @media (hover:none){
    /* Touch devices can't hover — tapping navigates immediately, so make
       sure the tap target itself is comfortably sized without relying on
       the label ever becoming visible. */
    .module-nav-icon{padding:8px;}
  }
  @media (max-width:700px){
    .module-nav-strip{flex-basis:100%;}
  }
  .mastermix-controls-row{
    display:flex;
    align-items:center;
    gap:10px 14px;
    flex-wrap:wrap;
    flex-basis:100%;
  }
  .promo-banner{
    background:var(--teal-wash);
    border:1px solid #bfe2dd;
    border-radius:var(--radius);
    padding:12px 16px;
    margin-bottom:18px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .promo-line{
    font-size:12.5px;
    color:var(--teal-deep);
    line-height:1.5;
  }
  .promo-line a{
    color:var(--teal-deep);
    font-weight:600;
    text-decoration:none;
    border-bottom:1px solid #9cd3cc;
  }
  .promo-line a:hover{border-bottom-color:var(--teal-deep);}
  .product-link-row{
    flex-basis:100%;
    margin-top:2px;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    column-gap:16px;
    row-gap:4px;
  }
  .product-link{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:12.5px;
    color:var(--teal-deep);
    text-decoration:none;
    white-space:normal;
    border-bottom:1px solid transparent;
    transition:border-color .15s;
  }
  .product-link:hover{border-bottom-color:var(--teal-deep);}
  .product-link svg{flex-shrink:0;}
  .default-toggle-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:12.5px;
    color:var(--ink-soft);
    background:#fafcfb;
    border:1px solid var(--line);
    border-radius:7px;
    padding:8px 12px;
    cursor:pointer;
    white-space:nowrap;
    transition:.15s;
  }
  .default-toggle-btn:hover{border-color:var(--teal);color:var(--teal-deep);}
  .default-toggle-btn svg{flex-shrink:0;}
  .default-toggle-btn.is-default{
    color:var(--teal-deep);
    background:var(--teal-wash);
    border-color:#bfe2dd;
  }

  /* ---------- home page ---------- */
  .home-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:18px;
    max-width:1080px;
    margin:20px auto 0;
  }
  @media (max-width:860px){
    .home-grid{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:560px){
    .home-grid{grid-template-columns:1fr;}
  }
  .home-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:32px 26px;
    text-align:left;
    cursor:pointer;
    font-family:inherit;
    transition:border-color .15s, box-shadow .15s, transform .15s;
  }
  .home-card:hover{
    border-color:var(--teal);
    box-shadow:0 6px 18px rgba(14,124,118,0.12);
    transform:translateY(-2px);
  }
  .home-card-icon{width:48px;height:48px;margin-bottom:14px;}
  .home-card-title{
    font-family:'IBM Plex Sans Condensed', sans-serif;
    font-weight:600;
    font-size:17px;
    color:var(--ink);
    margin-bottom:8px;
  }
  .home-card-desc{
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .home-card-badge{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    font-weight:600;
    letter-spacing:0.6px;
    text-transform:uppercase;
    color:var(--ink-soft);
    background:var(--grey-wash);
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px 9px;
    margin-bottom:10px;
  }

  /* ---------- Data Analysis 101 ---------- */
  .da-intro-panel p{
    margin:0 0 10px;
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.6;
  }
  .da-intro-panel p:last-child{margin-bottom:0;}
  .da-legend{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid var(--line);
  }
  .da-legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);}
  .da-legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .da-legend-line{width:16px;height:0;border-top:2px dashed var(--da-pink);flex-shrink:0;}
  .da-feature{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    margin-top:16px;
    display:grid;
    grid-template-columns:1fr 1.3fr;
    gap:20px;
    align-items:center;
  }
  @media (max-width:760px){
    .da-feature{grid-template-columns:1fr;}
  }
  .da-feature-text h3{
    font-family:'IBM Plex Sans Condensed', sans-serif;
    font-size:14.5px;
    color:var(--teal-deep);
    margin:0 0 8px;
  }
  .da-feature-text p{
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.6;
    margin:0;
  }
  .da-feature-plot{
    background:#fbfdfc;
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px;
  }
  .da-row-label{
    font-family:'IBM Plex Sans Condensed', sans-serif;
    font-size:11px;
    letter-spacing:0.8px;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:20px 2px 8px;
  }
  .da-row-label:first-of-type{margin-top:20px;}
  .da-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:16px;
  }
  .da-grid.cols-2{grid-template-columns:repeat(2, 1fr);}
  @media (max-width:900px){
    .da-grid{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:600px){
    .da-grid{grid-template-columns:1fr;}
  }
  .da-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    min-width:0;
  }
  .da-card-title{
    font-family:'IBM Plex Sans Condensed', sans-serif;
    font-weight:600;
    font-size:13px;
    color:var(--ink);
    margin-bottom:8px;
  }
  .da-card-plot{
    background:#fbfdfc;
    border:1px solid var(--line);
    border-radius:7px;
    padding:8px;
    margin-bottom:10px;
  }
  .da-card-desc{
    font-size:11.5px;
    color:var(--ink-soft);
    line-height:1.55;
  }

  /* ---------- ddPCR Experiment Planner ---------- */
  .planner-intro-panel p{
    margin:0 0 8px;
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.6;
  }
  .planner-intro-panel p:last-child{margin-bottom:0;}
  .planner-progress-bar{
    display:flex;
    gap:18px;
    align-items:center;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 18px;
    margin-bottom:18px;
    font-size:12.5px;
    color:var(--ink-soft);
    flex-wrap:wrap;
  }
  .planner-progress-bar strong{color:var(--ink);font-family:'IBM Plex Mono', monospace;}
  .planner-progress-track{
    width:120px;height:7px;background:#e3e9e7;border-radius:4px;overflow:hidden;flex-shrink:0;
  }
  .planner-progress-fill{height:100%;background:var(--teal);border-radius:4px;transition:width .2s;}
  .planner-section{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 18px 20px;
    margin-bottom:16px;
  }
  .planner-section-header{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:4px;
  }
  .planner-section-num{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    font-weight:600;
    color:var(--teal-deep);
    background:var(--teal-wash);
    border:1px solid #bfe2dd;
    border-radius:999px;
    width:23px;height:23px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .planner-section-title{
    font-family:'IBM Plex Sans Condensed', sans-serif;
    font-weight:600;
    font-size:15px;
    color:var(--ink);
  }
  .planner-section-desc{
    font-size:11.5px;
    color:var(--ink-soft);
    margin:0 0 16px 33px;
    line-height:1.5;
  }
  .planner-item{margin-bottom:14px;}
  .planner-item:last-child{margin-bottom:0;}
  .planner-item label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:5px;
  }
  .planner-textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:7px;
    padding:9px 10px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:12.5px;
    color:var(--ink);
    background:#fafcfb;
    outline:none;
    resize:vertical;
    min-height:38px;
    line-height:1.5;
    display:block;
  }
  .planner-textarea:focus{border-color:var(--teal);}
  .planner-textarea::placeholder{color:var(--ink-soft);opacity:0.65;}
  .planner-control-group{margin-bottom:16px;}
  .planner-control-group:last-child{margin-bottom:0;}
  .planner-control-group-title{
    font-family:'IBM Plex Sans Condensed', sans-serif;
    font-weight:600;
    font-size:12.5px;
    color:var(--teal-deep);
    margin-bottom:8px;
  }
  .planner-control-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:8px;
    flex-wrap:wrap;
  }
  .planner-control-row:last-child{margin-bottom:0;}
  .planner-control-row input[type=checkbox]{
    width:16px;height:16px;accent-color:var(--teal);cursor:pointer;flex-shrink:0;
  }
  .planner-control-row label{
    font-size:12.5px;
    color:var(--ink);
    cursor:pointer;
    flex:0 0 auto;
    min-width:170px;
    max-width:220px;
  }
  .planner-control-row input[type=text]{
    flex:1;
    min-width:160px;
    border:1px solid var(--line);
    border-radius:6px;
    padding:7px 9px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:12px;
    color:var(--ink);
    background:#fafcfb;
    outline:none;
  }
  .planner-control-row input[type=text]:focus{border-color:var(--teal);}
  .planner-control-row input[type=text]::placeholder{color:var(--ink-soft);opacity:0.65;}
  .planner-ready-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 0;
    border-bottom:1px solid #eef1f0;
  }
  .planner-ready-row:last-child{border-bottom:none;}
  .planner-ready-row input[type=checkbox]{
    width:17px;height:17px;accent-color:var(--teal);cursor:pointer;flex-shrink:0;
  }
  .planner-ready-row label{font-size:13px;color:var(--ink);cursor:pointer;flex:1;}
  .planner-ready-banner{
    font-size:12.5px;
    border-radius:8px;
    padding:12px 16px;
    margin-top:14px;
    line-height:1.5;
  }
  .planner-ready-banner.ok{
    color:var(--teal-deep);
    background:var(--teal-wash);
    border:1px solid #bfe2dd;
    font-weight:600;
  }
  .planner-ready-banner.pending{
    color:#8a5a12;
    background:#fbf1de;
    border:1px solid #ecd6a6;
  }
  .planner-print-section-h{
    font-family:'IBM Plex Sans Condensed', sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--teal-deep);
    margin:18px 0 4px;
  }
  .planner-print-section-h:first-child{margin-top:0;}
  .planner-print-group-h{
    font-size:12px;
    font-weight:600;
    color:var(--ink);
    margin:10px 0 2px;
  }
  .planner-print-q{
    font-weight:600;
    font-size:12px;
    color:var(--ink);
    margin-top:9px;
  }
  .planner-print-a{
    font-size:12px;
    color:var(--ink);
    white-space:pre-wrap;
    margin:2px 0 0;
    line-height:1.5;
  }
  .planner-print-a.empty{color:var(--ink-soft);font-style:italic;}
  .planner-print-check{font-size:12px;color:var(--ink);margin:3px 0;line-height:1.5;}

  /* ---------- learning resources list ---------- */
  .resource-list{display:flex;flex-direction:column;gap:10px;}
  .resource-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:9px;
    padding:14px 16px;
    transition:border-color .15s, box-shadow .15s;
  }
  .resource-item:hover{
    border-color:var(--teal);
    box-shadow:0 3px 10px rgba(14,124,118,0.1);
  }
  .resource-icon{width:20px;height:20px;flex-shrink:0;}
  .resource-title{
    font-family:'IBM Plex Sans Condensed', sans-serif;
    font-weight:600;
    font-size:13.5px;
    color:var(--ink);
  }
  .resource-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--ink-soft);
    margin-top:2px;
  }

  /* ---------- support profile cards (dummy) ---------- */
  .profile-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:16px;
  }
  @media (max-width:560px){
    .profile-grid{grid-template-columns:1fr;}
  }
  .profile-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 16px;
    text-align:center;
  }
  .profile-avatar{
    width:52px;height:52px;
    border-radius:50%;
    background:var(--teal-wash);
    border:1px solid #bfe2dd;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 12px;
    font-family:'IBM Plex Sans Condensed', sans-serif;
    font-weight:600;
    font-size:15px;
    color:var(--teal-deep);
  }
  .profile-role{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.8px;
    text-transform:uppercase;
    color:var(--teal-deep);
    margin-bottom:4px;
  }
  .profile-name{
    font-family:'IBM Plex Sans Condensed', sans-serif;
    font-weight:600;
    font-size:15px;
    color:var(--ink);
    margin-bottom:10px;
  }
  .profile-contact{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    line-height:1.7;
  }
  .profile-desc{
    font-size:11px;
    color:var(--ink-soft);
    line-height:1.45;
    margin:6px 0 10px;
  }
  .profile-card.personal{
    border-color:var(--teal);
    box-shadow:0 0 0 1px var(--teal);
    position:relative;
  }
  .profile-card-badge{
    position:absolute;
    top:10px;right:10px;
    font-family:'IBM Plex Mono', monospace;
    font-size:9px;
    letter-spacing:0.6px;
    text-transform:uppercase;
    color:var(--teal-deep);
    background:var(--teal-wash);

      if(state.individualTubes){
        const tubes = individualTubeRows(state, rv);
        rows.push(...tubes.rows);
        assaySum += tubes.assaySum;
      } else {
        Object.keys(assays).forEach(name=>{
          const fold = (state.assayFolds && state.assayFolds[name]) || 20;
          const v = assays[name] ? rv/fold : 0;
          assaySum += v;
          rows.push({label:`${fold}X Primers/Probe Mix ${name}`, finalConc:"900 nM/250 nM", perRxn:v, inMastermix:true, assay:name});
        });
      }
      const sample = sampleVolume;
      const water = rv - (supermix + enzymeMix + assaySum + sample);
      rows.push({label:"Total RNA", finalConc:null, perRxn:sample, inMastermix:false, isSample:true});
      rows.push({label:"RNase-/DNase-Free Water", finalConc:"—", perRxn:water, inMastermix:true});
      return rows;
    },
    protocol:[
      "Specify reaction volume (standard is 5 µL), RNA volume, number of reactions, and which assay channels you're running.",
      "Combine every mastermix component (everything except RNA) in a microcentrifuge tube.",
      "Vortex thoroughly for 15–30 s at max speed, then centrifuge briefly (30–60 s).",
      "Aliquot the mastermix into a PCR plate or 8-tube strips using the aliquot volume shown in the banner above.",
      "Add RNA to each well, then seal, vortex 15–30 s, and centrifuge briefly before loading.",
      "Note: final primer/probe concentrations are 900 nM (fwd), 900 nM (rev), 250 nM (probe); RNA input up to 500 ng per reaction."
    ],
    notes:"Final concentrations of 900 nM (primers) and 250 nM (probe) are widely-used starting points for hydrolysis-probe ddPCR assays \u2014 not a hard requirement. Optimal concentrations vary by assay design; some perform better with primers up to ~1000 nM or probes as low as ~50\u2013150 nM. If you've validated different concentrations, adjust your working stock in the Primer/Probe Mix Calculator tab, or edit the X-fold and concentration directly below \u2014 the volumes here scale correctly regardless, since they're based on total reaction volume rather than a specific target concentration."
  },
];

function qxProbeProtocol(){
  return [
    "Specify reaction volume (standard is 5 µL), DNA volume, number of reactions, and which assay channels you're running.",
    "Toggle Restriction Digest on if performing an in-reaction digest.",
    "Combine every mastermix component (everything except DNA) in a microcentrifuge tube.",
    "Vortex thoroughly for 15–30 s at max speed, then centrifuge briefly (30–60 s).",
    "Aliquot the mastermix into a PCR plate or 8-tube strips using the aliquot volume shown in the banner above.",
    "Add DNA to each well, then seal, vortex 15–30 s, and centrifuge briefly before loading."
  ];
}

function individualTubeRows(state, rv, opts){
  opts = opts || {};
  const includeProbe = opts.includeProbe !== false;
  const targetFwd = state.targetFwd ?? 900;
  const targetRev = state.targetRev ?? 900;
  const targetProbe = state.targetProbe ?? 250;
  const tubeVol = (targetNM, stockUM)=>{
    const stock = (stockUM > 0) ? stockUM : 0.0001;
    return round4((targetNM * rv) / (stock * 1000));
  };
  const rows = [];
  let assaySum = 0;
  Object.keys(state.assays).forEach(name=>{
    if(!state.assays[name]) return;
    const stock = (state.assayStocks && state.assayStocks[name]) || {fwd:100, rev:100, probe:100};
    const fwdVol = tubeVol(targetFwd, stock.fwd);
    const revVol = tubeVol(targetRev, stock.rev);
    assaySum += fwdVol + revVol;
    rows.push({label:`${name} Forward Primer`, finalConc:`${fmt(targetFwd,0)} nM`, perRxn:fwdVol, inMastermix:true, assay:name});
    rows.push({label:`${name} Reverse Primer`, finalConc:`${fmt(targetRev,0)} nM`, perRxn:revVol, inMastermix:true, assay:name});
    if(includeProbe){
      const probeVol = tubeVol(targetProbe, stock.probe);
      assaySum += probeVol;
      rows.push({label:`${name} Probe`, finalConc:`${fmt(targetProbe,0)} nM`, perRxn:probeVol, inMastermix:true, assay:name});
    }
  });
  return {rows, assaySum};
}

function individualTubeRowsSingle(state, rv){
  const targetFwd = state.targetFwd ?? 250;
  const targetRev = state.targetRev ?? 250;
  const stockFwd = state.stockFwd ?? 100;
  const stockRev = state.stockRev ?? 100;
  const tubeVol = (targetNM, stockUM)=>{
    const stock = (stockUM > 0) ? stockUM : 0.0001;
    return round4((targetNM * rv) / (stock * 1000));
  };
  const fwdVol = tubeVol(targetFwd, stockFwd);
  const revVol = tubeVol(targetRev, stockRev);
  return {
    rows:[
      {label:"Forward Primer", finalConc:`${fmt(targetFwd,0)} nM`, perRxn:fwdVol, inMastermix:true},
      {label:"Reverse Primer", finalConc:`${fmt(targetRev,0)} nM`, perRxn:revVol, inMastermix:true},
    ],
    sum: fwdVol + revVol
  };
}

function probeMixComponents(opts){
  return function(state){
    const {reactionVolume:rv, sampleVolume, assays} = state;
    const supermix = rv/opts.bufferFactor;
    const rows = [
      {label:opts.supermixLabel, finalConc:"1X", perRxn:supermix, inMastermix:true},
    ];
    let assaySum = 0;
    if(state.individualTubes){
      const tubes = individualTubeRows(state, rv);
      rows.push(...tubes.rows);
      assaySum += tubes.assaySum;
    } else {
      Object.keys(assays).forEach(name=>{
        const fold = (state.assayFolds && state.assayFolds[name]) || 20;
        const v = assays[name] ? rv/fold : 0;
        assaySum += v;
        rows.push({label:`${fold}X Primers/Probe Mix ${name}`, finalConc:"900 nM/250 nM", perRxn:v, inMastermix:true, assay:name});
      });
    }
    const enzymeVol = opts.enzymeVariable ? (state.enzymeVolume ?? round4(rv*opts.enzymeRatio)) : round4(rv*opts.enzymeRatio);
    const enzyme = state.digest ? enzymeVol : 0;
    const sample = sampleVolume;
    const water = rv - (supermix + assaySum + enzyme + sample);
    rows.push({label:"Diluted Restriction Enzyme", finalConc:"Variable", perRxn:enzyme, inMastermix:true});
    rows.push({label:"DNA", finalConc:null, perRxn:sample, inMastermix:false, isSample:true});
    rows.push({label:"RNase-/DNase-Free Water", finalConc:"—", perRxn:water, inMastermix:true});
    return rows;
  };
}

function naicaComponents(bufferFactor){
  return function(state){
    const {reactionVolume:rv, sampleVolume, assays} = state;
    const bufferA = rv/bufferFactor;
    const bufferBPct = state.bufferBPercent ?? 4;
    const bufferB = round4(rv * (bufferBPct/100));
    const rows = [
      {label:`naica ${bufferFactor}X Multiplex Supermix, Buffer A`, finalConc:"1X", perRxn:bufferA, inMastermix:true},
      {label:`naica ${bufferFactor}X Multiplex Supermix, Buffer B`, finalConc:`${fmt(bufferBPct)}%`, perRxn:bufferB, inMastermix:true},
    ];
    let assaySum = 0;
    if(state.individualTubes){
      const tubes = individualTubeRows(state, rv);
      rows.push(...tubes.rows);
      assaySum += tubes.assaySum;
    } else {
      Object.keys(assays).forEach(name=>{
        const fold = (state.assayFolds && state.assayFolds[name]) || 20;
        const v = assays[name] ? rv/fold : 0;
        assaySum += v;
        rows.push({label:`${fold}X Primer/Probe Mix ${name}`, finalConc:"900 nM/250 nM", perRxn:v, inMastermix:true, assay:name});
      });
    }
    const enzymeVol = state.enzymeVolume ?? round4(rv*0.03);
    const enzyme = state.digest ? enzymeVol : 0;
    const sample = sampleVolume;
    const water = rv - (bufferA + bufferB + assaySum + enzyme + sample);
    rows.push({label:"Diluted Restriction Enzyme", finalConc:"Variable", perRxn:enzyme, inMastermix:true});

    return rows;
  };
}
function naicaProtocol(){
  return [

function naicaEvaGreenComponents(bufferFactor){
  return function(state){
    const {reactionVolume:rv, sampleVolume} = state;
    const bufferA = rv/bufferFactor;
    const bufferBPct = state.bufferBPercent ?? 4;
    const bufferB = round4(rv * (bufferBPct/100));
    const evaGreen = round4(rv * 0.075);
    const dextranDefault = round4(rv * 0.04);
    const dextran = state.includeDextran ? (state.dextranVolume ?? dextranDefault) : 0;
    const sample = sampleVolume;
    const rows = [
      {label:`naica ${bufferFactor}X PCR MIX, Buffer A`, finalConc:"1X", perRxn:bufferA, inMastermix:true},
      {label:`naica ${bufferFactor}X PCR MIX, Buffer B`, finalConc:`${fmt(bufferBPct)}%`, perRxn:bufferB, inMastermix:true},
      {label:"EvaGreen, 20X", finalConc:"1.5X", perRxn:evaGreen, inMastermix:true},
      {label:"Dextran Alexa Fluor 647 (reference dye)", finalConc: state.includeDextran ? "7.4 µg/mL" : "—", perRxn:dextran, inMastermix:true},
    ];
    let primerSum;
    if(state.individualTubes){
      const tubes = individualTubeRowsSingle(state, rv);
      rows.push(...tubes.rows);
      primerSum = tubes.sum;
    } else {
      const fold = state.mixFold || 20;
      const primer = rv/fold;
      primerSum = primer;
      rows.push({label:`${fold}X Primer Mix`, finalConc:"250 nM (each)", perRxn:primer, inMastermix:true});
    }
    const enzymeVol = state.enzymeVolume ?? round4(rv*0.03);
    const enzyme = state.digest ? enzymeVol : 0;
    const water = rv - (bufferA + bufferB + evaGreen + dextran + primerSum + enzyme + sample);
    rows.push({label:"Diluted Restriction Enzyme", finalConc:"Variable", perRxn:enzyme, inMastermix:true});
    rows.push({label:"DNA", finalConc:null, perRxn:sample, inMastermix:false, isSample:true});
    rows.push({label:"Nuclease-Free Water", finalConc:"—", perRxn:water, inMastermix:true});
    return rows;
  };
}

// ---- Browser back/forward support -----------------------------------------
// We don't give each module its own URL/route. Instead, every time the user
// enters a module from Home we push one extra entry onto the browser's
// history stack (same URL, just a new state object). That means pressing the
// browser's back button fires a "popstate" event instead of leaving the app,
// and we use that event to snap the view back to Home. historyDepth tracks
// whether we currently have that extra entry pushed, so the in-app Home
// button can call history.back() and stay perfectly in sync with the
// browser's own back/forward buttons.
let historyDepth = 0;
function pushModuleHistory(){
  if(historyDepth > 0) return; // already one level deep; don't stack further entries
  try{
    window.history.pushState({ fasModuleView:true }, "", window.location.href);
    historyDepth = 1;
  }catch(e){ /* history API unavailable; navigation still works, just no back-button support */ }
}
window.addEventListener("popstate", function(){
  historyDepth = 0;
  currentView = "home";
  renderAll();
});

// Builds a static snapshot of whichever mastermix sheet is currently active.
// Rows are pre-computed plain data, not live references, so later edits on
// that tab won't change what's already been attached or printed.
function buildMastermixSnapshot(sheet, s){
  const rows = sheet.components(s);
  rows.forEach(r=>{ if(r.isSample) r.finalConc = sampleFinalConcText(sheet, s); });
  const mastermixRows = rows.filter(r=>r.inMastermix);
  const perRxnMastermixTotal = mastermixRows.reduce((a,r)=>a+r.perRxn,0);
  const totalMastermix = perRxnMastermixTotal * s.numReactions;
  const aliquotVolume = totalMastermix / s.numReactions;
  const waterRow = rows.find(r=>r.label.includes("Water"));
  const isError = waterRow && waterRow.perRxn < -0.0001;
  const snapshotRows = rows.map(r=>({
    label:r.label, finalConc:r.finalConc, perRxn:r.perRxn, total:r.perRxn * s.numReactions,
    isSample: !!r.isSample, assay: r.assay || null
  }));
  return {
    id:"mm"+Date.now()+Math.random().toString(36).slice(2,7),
    sheetId:sheet.id,
    sheetName:sheet.name,
    productName:sheet.productName || sheet.name,
    reactionVolume:s.reactionVolume,
    numReactions:s.numReactions,
    sampleLabel:sheet.sampleLabel,
    aliquotVolume, totalMastermix, isError,
    rows:snapshotRows,
    protocol:sheet.protocol.slice(),
    notes:sheet.notes || ""
  };
}

   ============================================================ */
function round4(n){
  return Math.round(n * 10000) / 10000;
}

function fmt(n, d=2){
  if(!isFinite(n)) return "—";
  const r = Math.round(n*100)/100;
  return r.toFixed(d).replace(/\.00$/,"").replace(/(\.\d)0$/,"$1");
}

function currentModuleId(){
  return currentView === "placeholder" ? placeholderKind : currentView;
}

// Builds the hoverable icon strip used in the nav bar so people can jump
// directly between modules without going back to Home first.
function renderModuleNavStrip(){
  const activeId = currentModuleId();
  const items = MODULES.map(mod=>{
    const isCurrent = mod.id === activeId;
    return `<button type="button" class="module-nav-icon${isCurrent ? " is-current" : ""}"
        data-module="${mod.id}" title="${pmEscapeAttr(mod.title)}${isCurrent ? " (current)" : ""}"
        aria-label="${pmEscapeAttr(mod.title)}" ${isCurrent ? 'aria-current="page"' : ""}>
      <span class="module-nav-icon-svg"><svg viewBox="0 0 48 48" fill="none">${MODULE_ICONS[mod.id]}</svg></span>
      <span class="module-nav-icon-label">${pmEscapeHtml(mod.title)}</span>
    </button>`;
  }).join("");
  const wrap = document.createElement("div");
  wrap.className = "module-nav-strip";
  wrap.innerHTML = items;
  wrap.querySelectorAll(".module-nav-icon").forEach(btn=>{
    const mod = MODULES.find(m=>m.id === btn.getAttribute("data-module"));
    if(!mod || mod.id === activeId) return; // current module isn't clickable
    btn.onclick = ()=> mod.go();
  });
  return wrap;
}

function renderContent(){
  if(currentView === "home"){
    renderHomeContent();
    return;
  }
  if(currentView === "primerPrep"){
    renderPrimerPrepContent();
    return;
  }
  if(currentView === "platemap"){
    renderPlatemapContent();
    return;
  }
  if(currentView === "experimentLog"){
    renderExperimentLogContent();
    return;
  }
  if(currentView === "dataAnalysis101"){
    renderDataAnalysis101Content();
    return;
  }
  if(currentView === "planner"){
    renderPlannerContent();
    return;
  }
  if(currentView === "placeholder"){
    renderPlaceholderContent();
    return;
  }
  const sheet = SHEETS.find(s=>s.id===activeTab);
  const s = state[sheet.id];
  const rows = sheet.components(s);
  rows.forEach(r=>{
    if(r.isSample) r.finalConc = sampleFinalConcText(sheet, s);
  });

  const mastermixRows = rows.filter(r=>r.inMastermix);
  const perRxnMastermixTotal = mastermixRows.reduce((a,r)=>a+r.perRxn,0);
  const totalMastermix = perRxnMastermixTotal * s.numReactions;
  const aliquotVolume = totalMastermix / s.numReactions; // per well, pre-sample
  const waterRow = rows.find(r=>r.label.includes("Water"));
  const isError = waterRow && waterRow.perRxn < -0.0001;

  const el = document.getElementById("tabContent");
  el.innerHTML = `
    <div class="grid">
      <div class="panel" id="inputsPanel"></div>

      <div>
        <div class="header-actions no-print" style="justify-content:flex-end;margin-bottom:12px;">
          <button class="btn" id="printMastermixBtn">Print This Recipe</button>
          <button class="btn" id="sendMastermixExpBtn">+ Send Recipe to Experiment Log</button>
        </div>
        <div class="aliquot-banner ${isError?'error':''}">
          ${gaugeSvg(s.reactionVolume>0? Math.min(aliquotVolume/s.reactionVolume,1):0, isError)}
          <div class="aliquot-text">
            <div class="num">${isError? '—' : fmt(aliquotVolume)+' µL'}</div>
            <div class="label">Aliquot volume per well (mastermix only, before ${sheet.sampleLabel})</div>
            <div class="sub">Total mastermix: ${isError? '—' : fmt(totalMastermix)+' µL'} across ${s.numReactions} reactions</div>
          </div>
        </div>
        <div class="panel">
          <h2>Per-well breakdown</h2>
          ${componentsTable(rows, isError)}
          <div class="warning ${isError?'show':''}">
            DNA/RNA + mix components exceed the reaction volume — water volume is negative. Reduce sample volume, add more reaction volume, or trim assay count.
          </div>
        </div>
        <div class="panel protocol">
          <h2>Protocol</h2>
          <ol>${sheet.protocol.map(p=>`<li>${p}</li>`).join("")}</ol>
        </div>
        ${sheet.notes ? `<div class="panel notes-panel">
          <h2>Notes</h2>
          <p>${sheet.notes}</p>
        </div>` : ""}
      </div>
    </div>
  `;
  document.getElementById("printMastermixBtn").onclick = printMastermixDirect;
  document.getElementById("sendMastermixExpBtn").onclick = (e)=>{
    sendMastermixToExperiment();
    flashButtonConfirm(e.currentTarget, "Sent \u2713");
  };
  renderInputs(sheet, s);
}

function gaugeSvg(fraction, isError){
  const f = Math.max(0, Math.min(1, fraction));
  const fillH = 44 * f;
  const y = 6 + (44 - fillH);
  const color = isError ? "#c0392b" : "#0e7c76";
  return `<svg class="gauge-svg" viewBox="0 0 40 58" fill="none">
    <defs><clipPath id="clip-${activeTab}"><path d="M20 4C20 4 6 22 6 32a14 14 0 0 0 28 0C34 22 20 4 20 4Z"/></clipPath></defs>
    <path d="M20 4C20 4 6 22 6 32a14 14 0 0 0 28 0C34 22 20 4 20 4Z" fill="#e3e9e7" stroke="#c9d3cf"/>
    <rect x="0" y="${y}" width="40" height="${fillH}" fill="${color}" clip-path="url(#clip-${activeTab})" opacity="0.85"/>
  </svg>`;
}

function componentsTable(rows, isError){
  return `<table>
    <thead><tr>
      <th>COMPONENT</th><th>FINAL CONC.</th><th class="num">µL / RXN</th><th class="num">TOTAL µL</th>
    </tr></thead>
    <tbody>
      ${rows.map(r=>{
        const total = r.perRxn * state[activeTab].numReactions;
        const isWater = r.label.includes("Water");
        const errRow = isWater && isError;
        const dot = r.assay ? `<span class="assay-dot" style="background:${ASSAY_COLORS[r.assay]}"></span> ` : "";
        return `<tr class="${errRow?'error-row':''}">
          <td class="label-cell">${dot}${r.label}${r.isSample? ' <span style="color:var(--ink-soft);font-weight:400;">(added after aliquoting)</span>':''}</td>
          <td>${r.finalConc}</td>
          <td class="num">${fmt(r.perRxn)}</td>
          <td class="num">${fmt(total)}</td>
        </tr>`;
      }).join("")}
      <tr class="total-row">
        <td class="label-cell">Total reaction volume</td>
        <td></td>
        <td class="num">${fmt(rows.reduce((a,r)=>a+r.perRxn,0))}</td>
        <td class="num">${fmt(rows.reduce((a,r)=>a+r.perRxn,0) * state[activeTab].numReactions)}</td>
      </tr>
    </tbody>
  </table>`;
}

function renderInputs(sheet, s){
  const panel = document.getElementById("inputsPanel");
  panel.innerHTML = `<h2>Reaction Setup</h2>`;

  panel.appendChild(numField("Reaction volume", "µL", s.reactionVolume, v=>{ s.reactionVolume=v; renderAll(); }, "Standard is 5 µL; up to 6 µL for overage."));
  panel.appendChild(numField("Number of reactions", "wells", s.numReactions, v=>{ s.numReactions=v; renderAll(); }, "Add a few extra wells for pipetting overage."));

  const sampleHint = `${sheet.sampleLabel} is added after aliquoting, not into the mastermix batch.`
    + (sheet.sampleVolumeHint ? ` ${sheet.sampleVolumeHint}` : "");
  panel.appendChild(numField(`${sheet.sampleLabel} volume`, "µL", s.sampleVolume, v=>{ s.sampleVolume=v; renderAll(); }, sampleHint));

  if(sheet.sampleMassRange){
    panel.appendChild(optionalNumField(`${sheet.sampleLabel} concentration`, "ng/µL", s.sampleConcentration, v=>{ s.sampleConcentration=v; renderAll(); }, "Optional — checks your input mass against the recommended range."));
    if(s.sampleConcentration!=null && !isNaN(s.sampleConcentration)){
      panel.appendChild(massStatusEl(sheet, s));
    }
    if(sheet.sampleMassRange.digestThreshold != null){
      const thresholdNote = document.createElement("div");
      thresholdNote.className = "info-note";
      thresholdNote.textContent = `If total input mass exceeds ${formatMass(sheet.sampleMassRange.digestThreshold)} per reaction, we recommend enabling Restriction Digest below.`;
      panel.appendChild(thresholdNote);
    }
  }

  if(sheet.dnaDigestNote){
    const note = document.createElement("div");
    note.className = "info-note";
    note.textContent = "Genomic DNA \u226510 kb should be fragmented by restriction digestion in a separate reaction before droplet generation. Not required for highly fragmented DNA (e.g. FFPE, cfDNA).";
    panel.appendChild(note);
  }

  if(sheet.hasBufferB){
    panel.appendChild(numField(
      "Buffer B final concentration",
      "%",
      s.bufferBPercent,
      v=>{ s.bufferBPercent=v; renderAll(); },
      "Buffer B is supplied at 100% and diluted down \u2014 typical 4%, range 2\u20135%.",
      5
    ));
    if(s.bufferBPercent > 5){
      const warn = document.createElement("div");
      warn.className = "mass-status warn";
      warn.style.marginTop = "-8px";
      warn.textContent = `${s.bufferBPercent}% exceeds the recommended max of 5% for Buffer B.`;
      panel.appendChild(warn);
    }
  }

  if(sheet.hasDextran){
    panel.appendChild(toggleField("Include Dextran reference dye", s.includeDextran, v=>{ s.includeDextran=v; renderAll(); }));
    if(s.includeDextran){
      const dextranDefault = round4(s.reactionVolume * 0.04);
      const dextranVal = s.dextranVolume ?? dextranDefault;
      panel.appendChild(numField(
        "Dextran Alexa Fluor 647 volume",
        "µL",
        dextranVal,
        v=>{ s.dextranVolume=v; renderAll(); },
        "Optional backup reference dye for Red/Infra-Red channel droplet detection. Defaults to the standard ratio (~0.04 µL per µL reaction)."
      ));
    }
  }

  if("digest" in s){
    panel.appendChild(toggleField("Restriction digest", s.digest, v=>{ s.digest=v; renderAll(); }));
    if(sheet.digestNotValidatedNote){
      const naicaNote = document.createElement("div");
      naicaNote.className = "info-note";
      naicaNote.textContent = "In-reaction digest has not been validated with naica supermixes.";
      panel.appendChild(naicaNote);
    }
    if(s.digest && sheet.enzymeVariable){
      const maxVol = round4(sheet.enzymeRatio * s.reactionVolume);
      const displayVol = s.enzymeVolume ?? maxVol;
      const enzymeHint = sheet.digestNotValidatedNote
        ? `Defaults to ${fmt(maxVol)} µL of diluted enzyme per ${fmt(s.reactionVolume)} µL reaction (0.15 µL per 5 µL reaction, scaled proportionally to your reaction volume).`
        : `Up to ${fmt(maxVol)} µL of diluted enzyme per ${fmt(s.reactionVolume)} µL reaction \u2014 target 0.5\u20131.25 units of enzyme per 5 µL reaction, scaled to your reaction volume.`;
      panel.appendChild(numField(
        "Restriction enzyme volume",
        "µL",
        displayVol,
        v=>{ s.enzymeVolume=v; renderAll(); },
        enzymeHint,
        maxVol
      ));
      if(displayVol > maxVol){
        const warn = document.createElement("div");
        warn.className = "mass-status warn";
        warn.style.marginTop = "-8px";
        warn.textContent = `${fmt(displayVol)} µL exceeds the recommended max of ${fmt(maxVol)} µL for a ${fmt(s.reactionVolume)} µL reaction \u2014 amounts above this haven't been validated by Bio-Rad.`;
        panel.appendChild(warn);
      }
    }
  }

  if(sheet.hasAssays){
    const h = document.createElement("h2");
    h.style.marginTop = "18px";
    h.textContent = "Assay channels";
    panel.appendChild(h);

    const checkedCount = Object.values(s.assays).filter(Boolean).length;

    if(sheet.maxAssays){
      const counter = document.createElement("div");
      counter.className = "assay-limit-note" + (checkedCount>=sheet.maxAssays ? " at-limit" : "");
      counter.textContent = `${checkedCount} of ${sheet.maxAssays} fluorophores selected \u2014 this mix supports up to ${sheet.maxAssays} channels.`;
      panel.appendChild(counter);
    }

    const grid = document.createElement("div");
    grid.className = "assay-grid";
    Object.keys(s.assays).forEach(name=>{
      const item = document.createElement("div");
      const checked = s.assays[name];
      const locked = sheet.maxAssays && !checked && checkedCount >= sheet.maxAssays;
      item.className = "assay-item" + (locked ? " locked" : "");
      const id = "assay-"+activeTab+"-"+name.replace(/[^a-zA-Z0-9]/g,"");
      if(!s.assayFolds) s.assayFolds = {};
      if(s.assayFolds[name] == null) s.assayFolds[name] = 20;
      const showFold = !s.individualTubes;
      const foldId = id+"-fold";
      const foldHtml = showFold ? `
        <span class="assay-fold">
          <input type="text" inputmode="decimal" id="${foldId}" value="${s.assayFolds[name]}" data-field-key="${foldId}">
          <span class="assay-fold-suffix">X</span>
        </span>` : "";
      item.innerHTML = `<input type="checkbox" id="${id}" ${checked?'checked':''} ${locked?'disabled':''} data-field-key="${id}">
        <span class="assay-dot" style="background:${ASSAY_COLORS[name]}"></span>
        <label for="${id}">${name}</label>
        ${foldHtml}`;
      item.querySelector("input[type=checkbox]").onchange = (e)=>{
        if(e.target.checked && sheet.maxAssays){
          const count = Object.values(s.assays).filter(Boolean).length;
          if(count >= sheet.maxAssays){
            e.target.checked = false;
            return;
          }
        }
        s.assays[name]=e.target.checked;
        renderAll();
      };
      const foldInput = item.querySelector(".assay-fold input");
      if(foldInput){
        foldInput.onchange = (e)=>{
          const v = parseFloat(e.target.value);
          s.assayFolds[name] = (isFinite(v) && v > 0) ? v : 20;
          renderAll();
        };
      }
      grid.appendChild(item);
    });
    panel.appendChild(grid);
    if(!s.individualTubes){
      const foldHint = document.createElement("div");
      foldHint.className = "info-note";
      foldHint.textContent = "Each channel's premixed working stock can use its own dilution factor (X) \u2014 20X is the usual default, but 40X, 50X, or any other fold works too. Edit the X value next to a channel to match your actual stock.";
      panel.appendChild(foldHint);
    }

    if(sheet.allowIndividualTubes){
      panel.appendChild(toggleField(
        "Individual primer/probe tubes",
        s.individualTubes,
        v=>{ s.individualTubes=v; renderAll(); }
      ));
      const tubeNote = document.createElement("div");
      tubeNote.className = "info-note";
      tubeNote.style.marginTop = "-8px";
      tubeNote.textContent = "Skip the pre-mixed working stock and pipette forward primer, reverse primer, and probe from separate tubes instead. Volumes are calculated from your own stock concentrations.";
      panel.appendChild(tubeNote);

      if(s.individualTubes){
        const targetH = document.createElement("h2");
        targetH.style.marginTop = "18px";
        targetH.textContent = "Target final concentrations";
        panel.appendChild(targetH);
        panel.appendChild(numField("Forward primer, final", "nM", s.targetFwd, v=>{ s.targetFwd=v; renderAll(); }, "Suggested: 900 nM. Applies to every selected channel."));
        panel.appendChild(numField("Reverse primer, final", "nM", s.targetRev, v=>{ s.targetRev=v; renderAll(); }, "Suggested: 900 nM. Applies to every selected channel."));
        panel.appendChild(numField("Probe, final", "nM", s.targetProbe, v=>{ s.targetProbe=v; renderAll(); }, "Suggested: 250 nM. Applies to every selected channel."));

        const stockH = document.createElement("h2");
        stockH.style.marginTop = "18px";
        stockH.textContent = "Tube stock concentrations";
        panel.appendChild(stockH);

        const checkedAssays = Object.keys(s.assays).filter(name=>s.assays[name]);
        if(checkedAssays.length === 0){
          const empty = document.createElement("div");
          empty.className = "info-note";
          empty.textContent = "Select at least one assay channel above to enter its tube stock concentrations.";
          panel.appendChild(empty);
        } else {
          checkedAssays.forEach(name=>{
            if(!s.assayStocks[name]) s.assayStocks[name] = {fwd:100, rev:100, probe:100};
            const stock = s.assayStocks[name];
            const sub = document.createElement("div");
            sub.style.display = "flex";
            sub.style.alignItems = "center";
            sub.style.gap = "6px";
            sub.style.margin = "10px 0 4px";
            sub.innerHTML = `<span class="assay-dot" style="background:${ASSAY_COLORS[name]}"></span><span style="font-size:12.5px;font-weight:600;color:var(--ink);">${name}</span>`;
            panel.appendChild(sub);
            panel.appendChild(numField(`${name} forward primer stock`, "µM", stock.fwd, v=>{ stock.fwd=v; renderAll(); }));
            panel.appendChild(numField(`${name} reverse primer stock`, "µM", stock.rev, v=>{ stock.rev=v; renderAll(); }));
            panel.appendChild(numField(`${name} probe stock`, "µM", stock.probe, v=>{ stock.probe=v; renderAll(); }));
          });
        }
      }
    }
  } else if(sheet.allowIndividualTubes){
    panel.appendChild(toggleField(
      "Individual primer tubes",
      s.individualTubes,
      v=>{ s.individualTubes=v; renderAll(); }
    ));
    const tubeNote = document.createElement("div");
    tubeNote.className = "info-note";
    tubeNote.style.marginTop = "-8px";
    tubeNote.textContent = "Skip the pre-mixed primer stock and pipette forward and reverse primer from separate tubes instead. Volumes are calculated from your own stock concentrations.";
    panel.appendChild(tubeNote);

    if(s.individualTubes){
      const targetH = document.createElement("h2");
      targetH.style.marginTop = "18px";
      targetH.textContent = "Target final concentrations";
      panel.appendChild(targetH);
      panel.appendChild(numField("Forward primer, final", "nM", s.targetFwd, v=>{ s.targetFwd=v; renderAll(); }, "Suggested: 250 nM (Bio-Rad's range is 100\u2013250 nM)."));
      panel.appendChild(numField("Reverse primer, final", "nM", s.targetRev, v=>{ s.targetRev=v; renderAll(); }, "Suggested: 250 nM (Bio-Rad's range is 100\u2013250 nM)."));

      const stockH = document.createElement("h2");
      stockH.style.marginTop = "18px";
      stockH.textContent = "Tube stock concentrations";
      panel.appendChild(stockH);
      panel.appendChild(numField("Forward primer stock", "µM", s.stockFwd, v=>{ s.stockFwd=v; renderAll(); }, "As ordered/resuspended (e.g. 100 µM standard oligo stock)."));
      panel.appendChild(numField("Reverse primer stock", "µM", s.stockRev, v=>{ s.stockRev=v; renderAll(); }));
    } else {
      if(s.mixFold == null) s.mixFold = 20;
      panel.appendChild(numField(
        "Primer mix dilution factor (X)", "fold", s.mixFold,
        v=>{ s.mixFold = (v && v > 0) ? v : 20; renderAll(); },
        "How concentrated your premixed primer stock is. 20X is the usual default, but 40X, 50X, or any other fold works too \u2014 match it to your stock from the Primer/Probe Mix Calculator tab."
      ));
    }
  }
}

function formatMass(ng){
  if(ng < 0.001) return `${fmt(ng*1e6,1)} fg`;
  if(ng < 1) return `${fmt(ng*1000,1)} pg`;
  return `${fmt(ng,2)} ng`;
}

function sampleFinalConcText(sheet, s){
  if(s.sampleConcentration!=null && !isNaN(s.sampleConcentration)){
    const mass = s.sampleVolume * s.sampleConcentration;
    return formatMass(mass);
  }
  if(sheet.sampleFinalConcDisplay) return sheet.sampleFinalConcDisplay;
  const range = sheet.sampleMassRange;
  if(!range) return "Variable";
  if(range.min!=null && range.max!=null) return `${formatMass(range.min)}–${formatMass(range.max)}`;
  if(range.max!=null) return `Up to ${formatMass(range.max)}`;
  if(range.min!=null) return `Variable (\u2265${formatMass(range.min)} typical)`;
  return "Variable";
}

function massStatusEl(sheet, s){
  const range = sheet.sampleMassRange;
  const mass = s.sampleVolume * s.sampleConcentration; // ng
  let msg, cls;
  if(range.max!=null && mass > range.max){
    msg = `${formatMass(mass)} exceeds the recommended max of ${formatMass(range.max)} per reaction — consider diluting your sample.`;
    cls = "mass-status error";
  } else if(range.digestThreshold!=null && mass > range.digestThreshold && !s.digest){
    msg = `${formatMass(mass)} is above ${formatMass(range.digestThreshold)} — restriction digestion is recommended for this input. Consider enabling the digest toggle.`;
    cls = "mass-status warn";
  } else if(range.digestThreshold!=null && mass > range.digestThreshold && s.digest){
    msg = `${formatMass(mass)} — digestion is enabled, appropriate for this input.`;
    cls = "mass-status ok";
  } else if(range.min!=null && mass < range.min){
    msg = `${formatMass(mass)} is a very low input (below ~${formatMass(range.min)}) — just a heads-up that concentrations this low may be difficult to detect. This can still be intentional (e.g. rare-target work), so it's your call.`;
    cls = "mass-status warn";
  } else {
    msg = `${formatMass(mass)} — within the recommended input range.`;
    cls = "mass-status ok";
  }
  const div = document.createElement("div");
  div.className = cls;
  div.textContent = msg;
  return div;
}

function optionalNumField(labelText, unit, value, onChange, hint){
  const wrap = document.createElement("div");
  wrap.className = "field";
  const displayVal = (value===null || value===undefined) ? "" : value;
  wrap.innerHTML = `<label>${labelText}</label>
    <div class="num-input">
      <input type="text" inputmode="decimal" placeholder="optional" value="${displayVal}" data-field-key="${labelText}">
      <span class="unit">${unit}</span>
    </div>
    ${hint ? `<span class="hint">${hint}</span>` : ""}`;
  const inputEl = wrap.querySelector("input");
  inputEl.onchange = (e)=>{
    const raw = e.target.value;
    if(raw === ""){ onChange(null); return; }
    const v = parseFloat(raw);
    onChange(isNaN(v) ? null : v);
  };
  return wrap;
}

   20X PRIMER/PROBE MIX PREP (home / pre-work page)
   ============================================================ */
function computePrimerPrep(){
  const st = primerPrepState;
  const X = st.dilutionFactor;
  const vol = st.totalMixVolume;
  const cfg = st.chemistry === "probe" ? st.probe : st.evagreen;
  const baseByKind = {
    fwd:   {label:"Forward Primer", targetKey:"targetFwd",   stockKey:"stockFwd"},
    rev:   {label:"Reverse Primer", targetKey:"targetRev",   stockKey:"stockRev"},
    probe: {label:"Probe",          targetKey:"targetProbe", stockKey:"stockProbe"},
  };
  const kindOrder = st.chemistry === "probe" ? ["fwd","rev","probe"] : ["fwd","rev"];

  function rowFor(label, finalNM, stock_uM, extraId){
    const target20X_uM = (finalNM * X) / 1000;
    const volNeeded = stock_uM > 0 ? (target20X_uM * vol) / stock_uM : NaN;
    const insufficient = !isFinite(volNeeded) || volNeeded > vol;
    const row = {label, finalNM, target20X_uM, stock_uM, volNeeded, insufficient};
    if(extraId) row.extraId = extraId;
    return row;
  }

  const allRows = [];
  kindOrder.forEach(kind=>{
    const c = baseByKind[kind];
    allRows.push(rowFor(c.label, cfg[c.targetKey], cfg[c.stockKey]));
    if(st.advancedMode){
      st.extras.filter(ex=>ex.kind===kind).forEach((ex, idx)=>{
        allRows.push(rowFor(extraLabel(kind, idx+2), ex.targetNM, ex.stockUM, ex.id));
      });
    }
  });

  const totalComponentVol = allRows.reduce((a,r)=>a + (isFinite(r.volNeeded) ? r.volNeeded : 0), 0);
  const diluent = vol - totalComponentVol;
  const hasError = allRows.some(r=>r.insufficient) || diluent < -0.0001;
  return {rows:allRows, diluent, vol, hasError};
}

function segmentedControl(labelText, options, value, onChange){
  const wrap = document.createElement("div");
  wrap.className = "field";
  const label = document.createElement("label");
  label.textContent = labelText;
  wrap.appendChild(label);
  const row = document.createElement("div");
  row.className = "segmented";
  options.forEach(opt=>{
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "segmented-btn" + (opt.value===value ? " active" : "");
    btn.textContent = opt.label;
    btn.onclick = ()=> onChange(opt.value);
    row.appendChild(btn);
  });
  wrap.appendChild(row);
  return wrap;
}

function primerPrepTable(result, X){
  const rows = result.rows.map(r=>{
    const errCls = r.insufficient ? "error-row" : "";
    return `<tr class="${errCls}">
      <td class="label-cell">${r.label}</td>
      <td>${fmt(r.stock_uM)} µM stock</td>
      <td>${fmt(r.target20X_uM)} µM (${X}X)</td>
      <td class="num">${isFinite(r.volNeeded) ? fmt(r.volNeeded) : '—'}</td>
    </tr>`;
  }).join("");
  return `<table>
    <thead><tr>
      <th>COMPONENT</th><th>YOUR STOCK</th><th>TARGET IN ${X}X MIX</th><th class="num">VOLUME TO ADD (µL)</th>
    </tr></thead>
    <tbody>
      ${rows}
      <tr class="${result.diluent<0 ? 'error-row' : ''}">
        <td class="label-cell">Nuclease-Free Water / TE Buffer</td>
        <td>—</td>
        <td>—</td>
        <td class="num">${fmt(result.diluent)}</td>
      </tr>
      <tr class="total-row">
        <td class="label-cell">Total mix volume</td>
        <td></td><td></td>
        <td class="num">${fmt(result.vol)}</td>
      </tr>
    </tbody>
  </table>`;
}

  if(st.chemistry==="probe"){
    panel.appendChild(numField("Probe stock", "µM", cfg.stockProbe, v=>{ cfg.stockProbe=v; renderAll(); }));
  }

  renderPrimerPrepExtras(panel);
}

function renderPrimerPrepExtras(panel){
  const st = primerPrepState;

  const h = document.createElement("h2");
  h.style.marginTop = "18px";
  h.textContent = "Advanced Assay Setup";
  panel.appendChild(h);

  panel.appendChild(toggleField("Add extra primers or probes", st.advancedMode, v=>{ st.advancedMode=v; renderAll(); }));

  const hint = document.createElement("div");
  hint.className = "advanced-hint";
  hint.textContent = "For SNP genotyping (e.g. a shared primer pair with separate FAM and HEX probes), nested PCR, or any assay that needs more than one primer or probe in the mix.";
  panel.appendChild(hint);

  if(!st.advancedMode) return;

  const kindOrder = ["fwd","rev","probe"];
  kindOrder.forEach(kind=>{
    st.extras.filter(ex=>ex.kind===kind).forEach((ex, idx)=>{
      const label = extraLabel(kind, idx+2);

      const entry = document.createElement("div");
      entry.className = "extra-entry";

      const header = document.createElement("div");
      header.className = "extra-entry-header";
      const title = document.createElement("div");
      title.className = "extra-entry-title";
      title.textContent = label;
      header.appendChild(title);
      const rmBtn = document.createElement("button");
      rmBtn.type = "button";
      rmBtn.className = "btn small danger";
      rmBtn.textContent = "Remove";
      rmBtn.onclick = ()=> removePrimerPrepExtra(ex.id);
      header.appendChild(rmBtn);
      entry.appendChild(header);

      entry.appendChild(numField(`${label}, final`, "nM", ex.targetNM, v=>{ ex.targetNM=v; renderAll(); }));
      entry.appendChild(numField(`${label} stock`, "µM", ex.stockUM, v=>{ ex.stockUM=v; renderAll(); }));

      panel.appendChild(entry);
    });
  });

  if(st.extras.length < 10){
    const addRow = document.createElement("div");
    addRow.className = "extra-add-row";
    [["fwd","+ Forward Primer"],["rev","+ Reverse Primer"],["probe","+ Probe"]].forEach(([kind,label])=>{
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn small ghost";
      btn.textContent = label;
      btn.onclick = ()=> addPrimerPrepExtra(kind);
      addRow.appendChild(btn);
    });
    panel.appendChild(addRow);
  } else {
    const note = document.createElement("div");
    note.className = "extra-limit-note";
    note.textContent = "Maximum of 10 additional entries reached.";
    panel.appendChild(note);
  }
}

function saveFocus(){
  const ae = document.activeElement;
  if(ae && ae.dataset && ae.dataset.fieldKey){
    return {
      key: ae.dataset.fieldKey,
      selStart: (typeof ae.selectionStart === "number") ? ae.selectionStart : null,
      selEnd: (typeof ae.selectionEnd === "number") ? ae.selectionEnd : null,
    };
  }
  return null;
}

function restoreFocus(saved){
  if(!saved) return;
  const escaped = saved.key.replace(/"/g, '\\"');
  const el = document.querySelector(`[data-field-key="${escaped}"]`);
  if(!el) return;
  el.focus();
  if(saved.selStart != null && el.setSelectionRange){
    try { el.setSelectionRange(saved.selStart, saved.selEnd); } catch(e){}
  }
}

function renderAll(){
  const saved = saveFocus();
  renderTabs();
  renderContent();
  restoreFocus(saved);
}

function fasComputeInitials(name){
  const parts = (name||"").trim().split(/\s+/).filter(Boolean);
  if(parts.length === 0) return "?";
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}

// Reads ?fasName=&fasEmail=&fasPhone= and ?aeName=&aeEmail=&aePhone= from the URL (once, on load).
// If present, saves each to localStorage and strips those params from the address bar
// so the link stays clean but the info persists across future visits and updates.
function captureFasFromURL(){
  const params = new URLSearchParams(window.location.search);
  let changed = false;
  PERSONAL_CONTACT_TYPES.forEach(type=>{
    const name = params.get(type.urlPrefix + "Name");
    if(!name) return;
    const contact = {
      role: type.role,
      name: name,
      email: params.get(type.urlPrefix + "Email") || "",
      phone: params.get(type.urlPrefix + "Phone") || "",
      initials: fasComputeInitials(name),
    };
    savePersonalContact(type.key, contact);
    params.delete(type.urlPrefix + "Name");
    params.delete(type.urlPrefix + "Email");
    params.delete(type.urlPrefix + "Phone");
    changed = true;
  });
  if(!changed) return;
  const cleanQuery = params.toString();
  const newUrl = window.location.pathname + (cleanQuery ? "?"+cleanQuery : "") + window.location.hash;
  window.history.replaceState(null, "", newUrl);
}

function copyTextToClipboard(text, btnEl){
  const done = ()=>{
    if(!btnEl) return;
    const original = btnEl.textContent;
    btnEl.textContent = "Copied!";
    setTimeout(()=>{ btnEl.textContent = original; }, 1500);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){}
  document.body.removeChild(ta);
}

/* ============================================================
   PLATEMAP LABELER
   ============================================================ */
const PM_CHIPS = ["Left","Middle","Right"];
const PM_ROWS = ["A","B","C","D","E","F","G","H"];
const PM_COLS = [1,2];

const PM_SAMPLE_TYPES = [
  {value:"", label:"— (blank) —"},
  {value:"Unknown", label:"Unknown"},
  {value:"Known", label:"Known"},
  {value:"PositiveControl", label:"Positive Control"},
  {value:"NegativeControl", label:"Negative Control"},
];

function pmChamberOrder(){
  const list = [];
  PM_COLS.forEach(col=>{
    PM_ROWS.forEach(row=>{
      list.push(row + col);
    });
  });
  return list;
}
const PM_CHAMBERS = pmChamberOrder(); // A1,B1,...,H1,A2,...,H2

function pmWellKey(chip, chamber){ return chip + "-" + chamber; }

const pmWells = {};
PM_CHIPS.forEach(chip=>{
  PM_CHAMBERS.forEach(chamber=>{
    pmWells[pmWellKey(chip, chamber)] = { sampleName:"", sampleType:"", context:"", dilution:null };
  });
});

let pmSelected = new Set(); // well keys
let pmLastClicked = null; // anchor for shift-range select, per chip
let pmIsDragging = false;
let pmDragChip = null;       // which chip the current drag started in
let pmDragAnchorChamber = null; // chamber the drag started from
let pmDragBase = new Set();  // selection to preserve underneath an additive (ctrl/cmd) drag

function pmParseChamber(chamber){
  const m = chamber.match(/^([A-H])(\d+)$/);
  return { row: m[1], col: parseInt(m[2], 10) };
}

function pmRangeChambers(chip, chamberA, chamberB){
  const a = pmParseChamber(chamberA);
  const b = pmParseChamber(chamberB);
  const rowIdxA = PM_ROWS.indexOf(a.row), rowIdxB = PM_ROWS.indexOf(b.row);
  const colIdxA = PM_COLS.indexOf(a.col), colIdxB = PM_COLS.indexOf(b.col);
  const [rowStart, rowEnd] = rowIdxA < rowIdxB ? [rowIdxA, rowIdxB] : [rowIdxB, rowIdxA];
  const [colStart, colEnd] = colIdxA < colIdxB ? [colIdxA, colIdxB] : [colIdxB, colIdxA];
  const out = [];
  for(let r = rowStart; r <= rowEnd; r++){
    for(let c = colStart; c <= colEnd; c++){
      out.push(pmWellKey(chip, PM_ROWS[r] + PM_COLS[c]));
    }
  }
  return out;
}

function pmHandleWellMouseDown(key, chip, e){
  const chamber = key.split("-")[1];

  if(e.shiftKey && pmLastClicked && pmLastClicked.chip === chip){
    pmRangeChambers(chip, pmLastClicked.chamber, chamber).forEach(k => pmSelected.add(k));
    renderPlatemapAll();
    return;
  }

  // Start a fresh drag. Ctrl/Cmd keeps the existing selection underneath
  // and adds the new drag range on top; a plain click starts a brand-new
  // selection, replacing whatever was selected before.
  pmDragBase = (e.metaKey || e.ctrlKey) ? new Set(pmSelected) : new Set();
  pmDragChip = chip;
  pmDragAnchorChamber = chamber;
  pmIsDragging = true;
  pmSelected = new Set([...pmDragBase, key]);
  pmLastClicked = { chip, chamber };
  renderPlatemapAll();
}

function pmHandleWellMouseEnter(key, chip){
  if(!pmIsDragging || chip !== pmDragChip) return;
  const chamber = key.split("-")[1];
  const range = pmRangeChambers(pmDragChip, pmDragAnchorChamber, chamber);
  pmSelected = new Set([...pmDragBase, ...range]);
  renderPlatemapAll();
}

document.addEventListener("mouseup", ()=>{
  pmIsDragging = false;
  pmDragChip = null;
  pmDragAnchorChamber = null;
  pmDragBase = new Set();
});

function pmSelectAllInChip(chip){
  PM_CHAMBERS.forEach(chamber=> pmSelected.add(pmWellKey(chip, chamber)));
  renderPlatemapAll();
}
function pmClearSelection(){
  pmSelected = new Set();
  renderPlatemapAll();
}
function pmClearWells(keys){
  keys.forEach(k=>{
    pmWells[k] = { sampleName:"", sampleType:"", context:"", dilution:null };
  });
  renderPlatemapAll();
}
function pmClearAll(){
  if(!confirm("Clear every well on the plate? This can't be undone.")) return;
  Object.keys(pmWells).forEach(k=>{
    pmWells[k] = { sampleName:"", sampleType:"", context:"", dilution:null };
  });
  pmSelected = new Set();
  renderPlatemapAll();
}

function pmSharedValue(field){
  const keys = Array.from(pmSelected);
  if(keys.length === 0) return { value:"", mixed:false };
  const first = pmWells[keys[0]][field];
  const mixed = keys.some(k => pmWells[k][field] !== first);
  return { value: mixed ? "" : (first ?? ""), mixed };
}

function pmApplyToSelection(field, value){
  pmSelected.forEach(k=>{ pmWells[k][field] = value; });
  renderPlatemapAll();
}

function pmCsvField(v){
  if(v === null || v === undefined) return "";
  const s = String(v);
  if(/[",\r\n]/.test(s)){
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

function pmBuildCSV(){
  const header = ["Chip Position","Chamber","Chip ID","Sample Name","Sample Type","Context","Dilution"];
  const lines = [header.join(",")];
  PM_CHIPS.forEach(chip=>{
    PM_CHAMBERS.forEach(chamber=>{
      const w = pmWells[pmWellKey(chip, chamber)];
      const row = [
        chip,
        chamber,
        "",
        pmCsvField(w.sampleName),
        pmCsvField(w.sampleType),
        pmCsvField(w.context),
        w.dilution === null || w.dilution === undefined || isNaN(w.dilution) ? "" : String(w.dilution),
      ];
      lines.push(row.join(","));
    });
  });
  return lines.join("\r\n") + "\r\n";
}

function pmExportCSV(){
  const csv = pmBuildCSV();
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "platemap_export.csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function pmEscapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function pmEscapeAttr(s){
  return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;");
}

function renderPlatemapContent(){
  const el = document.getElementById("tabContent");
  el.innerHTML = `

function pmRenderEditor(){

      </div>
      <div class="field">
        <label>Context</label>

      </div>

      </div>
    </div>
    <div class="editor-footer-actions">
      <button class="btn small" id="pmClearSelBtn">Clear Well${pmSelected.size>1?"s":""}</button>
      <button class="btn small ghost" id="pmDeselectBtn">Deselect</button>
    </div>
  `;

  const typeSelect = document.getElementById("pmFieldSampleType");
  PM_SAMPLE_TYPES.forEach(opt=>{
    const o = document.createElement("option");
    o.value = opt.value;
    o.textContent = type.mixed && opt.value==="" ? "(multiple values)" : opt.label;
    if(!type.mixed && opt.value === type.value) o.selected = true;
    typeSelect.appendChild(o);
  });

  document.getElementById("pmFieldSampleName").onchange = (e)=> pmApplyToSelection("sampleName", e.target.value);
  document.getElementById("pmFieldSampleType").onchange = (e)=> pmApplyToSelection("sampleType", e.target.value);
  document.getElementById("pmFieldContext").onchange = (e)=> pmApplyToSelection("context", e.target.value);
  document.getElementById("pmFieldDilution").onchange = (e)=>{
    const raw = e.target.value.trim();
    if(raw === ""){ pmApplyToSelection("dilution", null); return; }

    pmApplyToSelection("dilution", isNaN(v) ? null : v);
  };

  document.getElementById("pmDeselectBtn").onclick = pmClearSelection;
}

/* ---------- single-module print (isolated so one module can't get cut
   in half by page breaks from the other modules sharing the print page) ---------- */
function printHtmlString(bodyHtml, title){
  const styleTag = document.head.querySelector("style");
  const styleHtml = styleTag ? styleTag.outerHTML : "";
  const safeTitle = (title || "Print").replace(/</g, "&lt;");

  const iframe = document.createElement("iframe");
  iframe.style.position = "fixed";
  iframe.style.right = "0";
  iframe.style.bottom = "0";
  iframe.style.width = "0";
  iframe.style.height = "0";
  iframe.style.border = "0";
  document.body.appendChild(iframe);

  const cleanup = ()=>{ if(iframe.parentNode) iframe.parentNode.removeChild(iframe); };

  const doc = iframe.contentWindow.document;
  doc.open();
  doc.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${safeTitle}</title>${styleHtml}</head><body><div class="wrap"><div class="exp-print-page">${bodyHtml}</div></div></body></html>`);
  doc.close();

  iframe.onload = ()=>{
    setTimeout(()=>{
      iframe.contentWindow.focus();
      iframe.contentWindow.onafterprint = cleanup;
      iframe.contentWindow.print();
      setTimeout(cleanup, 1500); // fallback in case afterprint doesn't fire
    }, 150);
  };
}

/* ---------- "print together" as a downloadable Word document, so the user
   can freely adjust margins/spacing/page breaks themselves instead of
   fighting the browser's print pagination ---------- */
function downloadWordDoc(filename, bodyHtml){
  const preHtml = `<!DOCTYPE html>
<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head>
<meta charset="utf-8">
<title>Experiment Log</title>
<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/></w:WordDocument></xml><![endif]-->
<style>
  @page { margin: 0.6in; }
  body { font-family: Calibri, "IBM Plex Sans", Arial, sans-serif; font-size: 10.5pt; color:#10201d; }
  h1 { font-size:17pt; margin:0 0 4pt; }
  h2 { font-size:13pt; color:#085a56; margin:16pt 0 4pt; }
  h3 { font-size:11.5pt; color:#085a56; margin:10pt 0 4pt; }

  table { border-collapse:collapse; width:100%; margin-bottom:8pt; }
  th, td { border:1px solid #d6e0dc; padding:4pt 6pt; font-size:9.5pt; text-align:left; vertical-align:top; }
  th { background:#eef2f0; }
  td.num, th.num { text-align:right; }

  ol.protocol li { font-size:9.5pt; margin-bottom:4pt; }

  div.notes-block .notes-label { font-size:8.5pt; letter-spacing:0.5pt; text-transform:uppercase; color:#085a56; font-weight:bold; margin-bottom:4pt; }
  div.notes-block .notes-body { font-size:10pt; white-space:pre-wrap; }
  table.well-table { width:auto; }
  table.well-table td { text-align:center; font-size:8pt; padding:4pt 8pt; min-width:60pt; }
  table.combined-plate td.chip-header { text-align:center; font-weight:bold; background:#e3f2f0; color:#085a56; }

  h2, h3 { page-break-after:avoid; mso-pagination:widow-orphan; }
</style>
</head>
<body>`;
  const postHtml = "</body></html>";
  const full = preHtml + bodyHtml + postHtml;

}

// Word's HTML filter doesn't reliably honor page-break-before set on a wrapping
// <div> — it can insert the break partway through the div's content instead
// (which was orphaning the "Platemap" heading on its own page). This explicit
// break marker is the syntax Word itself uses/expects, so it breaks exactly
// where placed, right before the heading and its table.
const WORD_PAGE_BREAK = '<br clear="all" style="mso-special-character:line-break;page-break-before:always">';

function buildWordSnapshotHtml(snap, isFirst){
  const totalPerRxn = snap.rows.reduce((a,r)=>a+r.perRxn,0);
  const totalAll = totalPerRxn * snap.numReactions;
  const subLine = snap.isError
    ? "\u2014 water volume negative, check inputs before mixing"
    : `\u2014 ${fmt(snap.totalMastermix)} \u00b5L total mastermix \u00b7 aliquot ${fmt(snap.aliquotVolume)} \u00b5L/well`;
  let html = isFirst ? "" : WORD_PAGE_BREAK;
  html += `<div>`;
  html += `<h2>${pmEscapeHtml(snap.productName)}</h2>`;
  html += `<p class="meta">${fmt(snap.reactionVolume)} \u00b5L reactions \u00d7 ${snap.numReactions} ${subLine}</p>`;
  html += `<table><thead><tr><th>Component</th><th>Final Conc.</th><th class="num">\u00b5L / Rxn</th><th class="num">Total \u00b5L</th></tr></thead><tbody>`;
  snap.rows.forEach(r=>{
    const label = pmEscapeHtml(r.label) + (r.isSample ? " (added after aliquoting)" : "");
    html += `<tr><td>${label}</td><td>${pmEscapeHtml(String(r.finalConc))}</td><td class="num">${fmt(r.perRxn)}</td><td class="num">${fmt(r.total)}</td></tr>`;
  });
  html += `<tr class="total-row"><td>Total reaction volume</td><td></td><td class="num">${fmt(totalPerRxn)}</td><td class="num">${fmt(totalAll)}</td></tr>`;
  html += `</tbody></table>`;
  html += `<ol class="protocol">${snap.protocol.map(p=>`<li>${p}</li>`).join("")}</ol>`;
  html += `</div>`;
  return html;
}

function buildWordPlatemapHtml(snapshot, isFirst){
  const capturedLabel = new Date(snapshot.capturedAt).toLocaleString();
  let html = isFirst ? "" : WORD_PAGE_BREAK;
  html += `<div>`;
  html += `<h2>Platemap</h2>`;
  html += `<p class="meta">Captured ${pmEscapeHtml(capturedLabel)}</p>`;

  html += `<table class="well-table combined-plate"><tbody>`;

  // header row: chip name spans its 2 columns, with a thin spacer column between chips
  html += `<tr>`;
  PM_CHIPS.forEach((chip, ci)=>{
    html += `<td colspan="2" class="chip-header">${pmEscapeHtml(chip)} Chip</td>`;
    if(ci < PM_CHIPS.length - 1) html += `<td class="spacer"></td>`;
  });
  html += `</tr>`;

  // 8 data rows (A-H), 2 columns per chip, spacer column between chips
  PM_ROWS.forEach(row=>{
    html += `<tr>`;
    PM_CHIPS.forEach((chip, ci)=>{
      PM_COLS.forEach(col=>{
        const chamber = row + col;
        const w = snapshot.wells[pmWellKey(chip, chamber)] || {sampleName:"", sampleType:""};
        const bg = w.sampleType === "Unknown" ? "#e6eef5"
          : w.sampleType === "Known" ? "#e3f2f0"
          : w.sampleType === "PositiveControl" ? "#e4f3e6"
          : w.sampleType === "NegativeControl" ? "#fbe9e7"
          : "#ffffff";
        const name = w.sampleName ? pmEscapeHtml(w.sampleName) : "&nbsp;";
        html += `<td style="background:${bg};"><strong>${chamber}</strong><br>${name}</td>`;
      });
      if(ci < PM_CHIPS.length - 1) html += `<td class="spacer"></td>`;
    });
    html += `</tr>`;
  });

  html += `</tbody></table>`;
  html += `</div>`;
  return html;
}

function buildWordPrimerPrepHtml(snap, isFirst){
  const subLine = snap.hasError
    ? "\u2014 one or more stocks insufficiently concentrated, check inputs"
    : `\u2014 ${fmt(snap.totalMixVolume)} \u00b5L total at a ${fmt(snap.dilutionFactor,0)}-fold dilution factor`;
  let html = isFirst ? "" : WORD_PAGE_BREAK;
  html += `<div>`;
  html += `<h2>${pmEscapeHtml(snap.title)}</h2>`;
  html += `<p class="meta">${subLine}</p>`;
  html += `<table><thead><tr><th>Component</th><th>Your Stock</th><th>Target in ${fmt(snap.dilutionFactor,0)}X Mix</th><th class="num">Volume to Add (\u00b5L)</th></tr></thead><tbody>`;
  snap.rows.forEach(r=>{
    html += `<tr><td>${pmEscapeHtml(r.label)}</td><td>${fmt(r.stock_uM)} \u00b5M stock</td><td>${fmt(r.target20X_uM)} \u00b5M (${fmt(snap.dilutionFactor,0)}X)</td><td class="num">${isFinite(r.volNeeded) ? fmt(r.volNeeded) : '\u2014'}</td></tr>`;
  });
  html += `<tr><td>Nuclease-Free Water / TE Buffer</td><td>\u2014</td><td>\u2014</td><td class="num">${fmt(snap.diluent)}</td></tr>`;
  html += `<tr class="total-row"><td>Total mix volume</td><td></td><td></td><td class="num">${fmt(snap.vol)}</td></tr>`;
  html += `</tbody></table>`;
  html += `<ol class="protocol">${snap.notes.map(n=>`<li>${n}</li>`).join("")}</ol>`;
  html += `</div>`;
  return html;
}

function generateExperimentWordDoc(){
  const log = experimentLog;
  const metaBits = [];
  if(log.meta.date) metaBits.push(pmEscapeHtml(log.meta.date));
  if(log.meta.operator) metaBits.push("Operator: " + pmEscapeHtml(log.meta.operator));

  let body = `<h1>${log.meta.name ? pmEscapeHtml(log.meta.name) : "Untitled Experiment"}</h1>`;
  body += `<p class="meta">${metaBits.join(" \u00b7 ")}</p>`;

  const notesText = (log.meta.notes || "").trim();
  body += `<div class="notes-block"><div class="notes-label">Notes</div><div class="notes-body">${notesText ? pmEscapeHtml(notesText) : "&nbsp;"}</div></div>`;

  if(log.mastermixSnapshots.length === 0 && log.primerPrepSnapshots.length === 0 && !log.platemapSnapshot){
    body += `<p>Nothing attached yet. Send a primer/probe mix, mastermix recipe, and/or your platemap here from their respective tabs, then download this Word document for your lab notebook.</p>`;
  }

  let isFirst = true;
  log.primerPrepSnapshots.forEach(snap=>{
    body += buildWordPrimerPrepHtml(snap, isFirst);
    isFirst = false;
  });
  log.mastermixSnapshots.forEach(snap=>{
    body += buildWordSnapshotHtml(snap, isFirst);
    isFirst = false;
  });
  if(log.platemapSnapshot){
    body += buildWordPlatemapHtml(log.platemapSnapshot, isFirst);
    isFirst = false;
  }

  const rawName = (log.meta.name && log.meta.name.trim()) ? log.meta.name.trim() : "experiment_log";
  const filename = rawName.replace(/[^a-z0-9]+/gi, "_").replace(/^_+|_+$/g, "").toLowerCase() + ".doc";
  downloadWordDoc(filename, body);
}

/* ============================================================
   DATA ANALYSIS 101 — illustrative droplet amplitude plots
   ============================================================ */
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function daGaussian(rng, mean, sd){
  const u = Math.max(rng(), 1e-6);
  const v = rng();
  const z = Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v);
  return mean + z*sd;
}
function daMakeWell(seed, opts){
  const {nNeg=0, nPos=0, nRain=0, negMean=3100, negSD=220, posMean=8500, posSD=260, rainMin=4300, rainMax=7100} = opts;
  const rng = mulberry32(seed);
  const points = [];
  for(let i=0;i<nNeg;i++) points.push({rfu: Math.max(150, daGaussian(rng, negMean, negSD)), positive:false});
  for(let i=0;i<nPos;i++) points.push({rfu: Math.min(10200, daGaussian(rng, posMean, posSD)), positive:true});
  for(let i=0;i<nRain;i++) points.push({rfu: rainMin + rng()*(rainMax-rainMin), positive:false, rain:true});
  for(let i=points.length-1;i>0;i--){
    const j = Math.floor(rng()*(i+1));
    [points[i], points[j]] = [points[j], points[i]];
  }
  points.forEach((p,i)=> p.event = i+1);
  return points;
}
